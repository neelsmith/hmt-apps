<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-version" content="0.2.0">
<title>Codices</title>
<style>
  :root {
    --bg: #fbfaf7; --fg: #1f1d1a; --muted: #6b655c; --line: #e4dfd5; --panel: #ffffff;
    --accent: #8a2f1d; --accent-fg: #fff; --focus: #2a5bd7; --err: #a3201a;
    --table: #2b2a28; --table-fg: #ece7de; --cell: #3a3835;
    --c-iliad: #e0452c; --c-scholia: #2f7de1; --c-other: #2fa36b;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1a1816; --fg: #ece7de; --muted: #a39b8d; --line: #3a362f; --panel: #23201d;
            --accent: #e0896f; --accent-fg: #1a1816; --focus: #8fb0ff; --err: #ff8a80;
            --table: #121110; --cell: #23211f; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: .25rem 1rem; align-items: baseline; padding: .6rem 1rem; border-bottom: 1px solid var(--line); }
  h1 { font-size: 1.15rem; margin: 0; }
  #status { color: var(--muted); font-size: .875rem; }
  .appmeta { order: -1; flex: 0 0 100%; display: flex; justify-content: flex-end; flex-wrap: wrap; gap: .25rem 1rem; font-size: .875rem; color: var(--muted); }
  .appmeta .home { margin-right: auto; }
  .appmeta a { color: var(--accent); }
  button, select, input { font: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 6px; padding: .3rem .7rem; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  [hidden] { display: none !important; }

  /* ---- viewer ---- */
  #viewer-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #viewer-bar { display: flex; flex-wrap: wrap; gap: .4rem .9rem; align-items: center; padding: .5rem 1rem;
         border-bottom: 1px solid var(--line); background: var(--bg); }
  #viewer-title { font-weight: 600; flex: 1 1 12rem; min-width: 0; }
  .group { display: inline-flex; gap: .4rem; align-items: center; }
  .group label { display: inline-flex; gap: .3rem; align-items: center; font-size: .875rem; }
  .chip { width: .8rem; height: .8rem; border-radius: 2px; display: inline-block; border: 2px solid; }
  .chip.iliad { border-color: var(--c-iliad); background: color-mix(in srgb, var(--c-iliad) 20%, transparent); }
  .chip.scholia { border-color: var(--c-scholia); background: color-mix(in srgb, var(--c-scholia) 20%, transparent); }
  .chip.other { border-color: var(--c-other); background: color-mix(in srgb, var(--c-other) 20%, transparent); }
  #viewer-wrap { position: relative; flex: 1; min-height: 0; background: #1b1a19; }
  #viewer { position: absolute; inset: 0; cursor: grab; outline-offset: -2px; }
  #viewer.dragging { cursor: grabbing; }
  #viewer-note { position: absolute; left: .75rem; bottom: .6rem; background: #000a; color: #fff; padding: .15rem .5rem;
         border-radius: 4px; font-size: .8125rem; pointer-events: none; max-width: calc(100% - 1.5rem); }
  .roi { fill-opacity: .13; stroke-width: 1.5px; vector-effect: non-scaling-stroke; pointer-events: all; }
  .roi.iliad { fill: var(--c-iliad); stroke: var(--c-iliad); }
  .roi.scholia { fill: var(--c-scholia); stroke: var(--c-scholia); }
  .roi.other { fill: var(--c-other); stroke: var(--c-other); }
  .roi.hot { fill-opacity: .38; stroke-width: 3px; }
  #rois.hide-iliad .roi.iliad, #rois.hide-scholia .roi.scholia, #rois.hide-other .roi.other { display: none; }
  #rois.hide-all .roi { display: none; }
  #tip { position: absolute; z-index: 5; max-width: min(34rem, calc(100% - 1rem)); max-height: 60%; overflow: hidden;
         background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
         padding: .45rem .65rem; box-shadow: 0 4px 16px #0006; pointer-events: none; font-size: .9375rem; }
  #tip .item + .item { margin-top: .5rem; padding-top: .5rem; border-top: 1px solid var(--line); }
  #tip .what { font: .8125rem ui-monospace, monospace; color: var(--muted); }
  #tip .what b { font-weight: 700; color: var(--fg); }
  .greek { font-family: "Gentium Plus", "Cardo", "Palatino Linotype", "Times New Roman", serif; font-size: 1.1rem; line-height: 1.5; }
  #tip .lemma { font-weight: 700; }
  #tip .none { color: var(--muted); font-style: italic; }

  #controls label.sel { display: inline-flex; gap: .4rem; align-items: center; min-width: 0; }
  #controls select { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); padding: .3rem .5rem; max-width: 100%; min-width: 0; }
  .roi { cursor: pointer; }
  #copied { position: absolute; right: .75rem; top: .6rem; z-index: 6; background: var(--ok-bg, #1f6b3a); color: #fff; padding: .2rem .6rem;
         border-radius: 4px; font-size: .8125rem; pointer-events: none; max-width: calc(100% - 1.5rem); }
  #copied.bad { background: #a3201a; }
  #controls { flex-wrap: wrap; }
  #codex { width: 16rem; } #page { width: 15rem; }
  #intro { position: absolute; inset: 0; display: grid; place-items: center; padding: 1rem; text-align: center; color: #d8d2c8; }
  #viewer-error { position: absolute; inset: 0; display: grid; place-items: center; padding: 1rem; text-align: center; color: #ffb4a8; background: #1b1a19; }

  /* ---- loading / errors ---- */
  #drop { margin: 1rem; padding: 1rem; border: 2px dashed var(--line); border-radius: 8px; text-align: center; color: var(--muted);
          background: var(--bg); }
  body.dragging #drop { border-color: var(--accent); }
  #drop input[type=file] { max-width: 100%; }
  #problem { color: var(--err); }
  @media (max-width: 40rem) { header { padding: .5rem .75rem; } #viewer-bar { padding: .5rem .75rem; } #controls { width: 100%; } #controls label.sel { flex: 1 1 100%; } #codex, #page { flex: 1; width: auto; } }
</style>
</head>
<body>
<header>
  <h1>Codices</h1>
  <span id="status" role="status">Loading the current HMT release…</span>
  <span class="appmeta"><a class="home" href="https://neelsmith.github.io/hmt-apps/">← HMT apps home</a><span class="version">Version 0.2.0</span><a class="docs" href="https://neelsmith.github.io/hmt-apps/docs/codices/">Docs</a></span>
</header>

<div id="drop" hidden>
  <p id="problem"></p>
  <p>You can load a saved copy of the release instead (<code>hmt-current.cex</code>): drop it here or <input type="file" id="file" accept=".cex,.txt,text/plain">.</p>
</div>

<section id="viewer-view">
  <div id="viewer-bar">
    <span id="controls" class="group">
      <label class="sel">Codex <select id="codex" disabled></select></label>
      <label class="sel">Page <select id="page" disabled title="● marks pages with indexed text; the number is how many passages"></select></label>
      <button class="btn" id="prev" title="Previous page ([)" aria-label="Previous page" disabled>‹</button>
      <button class="btn" id="next" title="Next page (])" aria-label="Next page" disabled>›</button>
    </span>
    <span class="group" role="group" aria-label="Regions shown">
      <label><input type="checkbox" id="show-iliad" checked><span class="chip iliad"></span>Iliad</label>
      <label><input type="checkbox" id="show-scholia" checked><span class="chip scholia"></span>Scholia</label>
      <label><input type="checkbox" id="show-other" checked><span class="chip other"></span>Other</label>
    </span>
    <span class="group">
      <button class="btn" id="zoom-out" title="Zoom out (-)" aria-label="Zoom out">−</button>
      <button class="btn" id="zoom-in" title="Zoom in (+)" aria-label="Zoom in">+</button>
      <button class="btn" id="fit" title="Fit page (0)">Fit</button>
    </span>
  </div>
  <div id="viewer-wrap">
    <div id="viewer" aria-label="Page image. Drag to pan, scroll or pinch to zoom."></div>
    <p id="intro">Choose a codex, then a page. Hover over a rectangle to read its text; click to copy it.</p>
    <div id="viewer-note" hidden></div>
    <div id="viewer-error" role="alert" hidden></div>
    <div id="tip" hidden></div>
    <div id="copied" role="status" hidden></div>
  </div>
</section>

<script>
// @ts-check
/**
 * Parsing of an HMT data release (a single CEX text file).
 *
 * Design notes
 * - No imports and no dependencies, so this file runs unchanged in Node
 *   (tests) and in a browser, and can later be inlined into a single-file app
 *   by stripping the leading `export` keywords.
 * - Parsing never throws on irregular data.  Irregularities are collected as
 *   warnings: see `HmtRelease.validate()`.
 */

/** Block labels recognised in a release, in the order given in CLAUDE.md. */
const BLOCK_TYPES = [
  'cexversion', 'citelibrary', 'citecollections', 'citeproperties',
  'citedata', 'datamodels', 'ctscatalog', 'ctsdata', 'citerelationset',
];

/** Default location of the current release. */
const DEFAULT_RELEASE_URL =
  'https://raw.githubusercontent.com/homermultitext/hmt-archive/refs/heads/master/releases-cex/hmt-current.cex';

/** Block types whose repeated blocks each start with the same header line. */
const FIXED_HEADER_TYPES = new Set(['citecollections', 'citeproperties', 'datamodels', 'ctscatalog']);

// ---------------------------------------------------------------------------
// Step 1: split text into labelled blocks
// ---------------------------------------------------------------------------

/**
 * @typedef {Object} Block
 * @property {string} type       Label without the `#!` prefix.
 * @property {number} startLine  1-based line number of the header line.
 * @property {string[]} lines    Data lines: comments and blank lines removed.
 */

/**
 * Split CEX text into blocks.  Lines starting with `//` and empty lines are
 * dropped.  Everything between a `#!` header line and the next belongs to the
 * first.
 * @param {string} text
 * @returns {{blocks: Block[], warnings: string[]}}
 */
function splitBlocks(text) {
  /** @type {Block[]} */
  const blocks = [];
  /** @type {string[]} */
  const warnings = [];
  /** @type {Block | null} */
  let current = null;
  const lines = text.split(/\r?\n/);
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.startsWith('#!')) {
      const type = line.slice(2).trim();
      if (!BLOCK_TYPES.includes(type)) {
        warnings.push(`line ${i + 1}: unrecognized block type "${type}"`);
      }
      current = { type, startLine: i + 1, lines: [] };
      blocks.push(current);
      continue;
    }
    if (line.startsWith('//') || line.trim() === '') continue;
    if (current === null) {
      warnings.push(`line ${i + 1}: content before the first block header ignored`);
      continue;
    }
    current.lines.push(line);
  }
  return { blocks, warnings };
}

// ---------------------------------------------------------------------------
// URN helpers (CITE2 and CTS)
// ---------------------------------------------------------------------------

/** True for a collection-level CITE2 URN, e.g. `urn:cite2:hmt:e3pages.v1:`. */
function isCollectionUrn(urn) {
  return /^urn:cite2:[^:]+:[^:]+:$/.test(urn);
}

/** Collection-level URN for an object URN, or null if `urn` is not CITE2. */
function collectionOfObject(urn) {
  const m = /^(urn:cite2:[^:]+:[^:]+:)/.exec(urn);
  return m ? m[1] : null;
}

/**
 * Collection-level URN for a property-level URN, e.g.
 * `urn:cite2:citebl:burney86pages.v1.sequence:` gives
 * `urn:cite2:citebl:burney86pages.v1:`.  Null if not property-level.
 */
function collectionOfProperty(urn) {
  const m = /^(urn:cite2:[^:]+:[^:]+)\.[^.:]+:$/.exec(urn);
  return m ? m[1] + ':' : null;
}

/** Property-level URN for a property name in a collection. */
function propertyUrn(collectionUrn, name) {
  return collectionUrn.slice(0, -1) + '.' + name + ':';
}

/**
 * Work-component prefix of a CTS URN (`urn:cts:ns:group.work.version[.exemplar]:`),
 * which is version-level or exemplar-level depending on the URN.
 */
function ctsWorkOf(urn) {
  const m = /^(urn:cts:[^:]+:[^:]+:)/.exec(urn);
  return m ? m[1] : null;
}

/** Version-level CTS URN (`urn:cts:ns:group.work.version:`): drops any exemplar part. */
function ctsVersionOf(urn) {
  const m = /^(urn:cts:[^:]+:)([^:]+):/.exec(urn);
  return m ? m[1] + m[2].split('.').slice(0, 3).join('.') + ':' : null;
}

// ---------------------------------------------------------------------------
// Step 2: typed access
// ---------------------------------------------------------------------------

/**
 * Parse lines of delimited text into objects keyed by `fields`.  Rows with the
 * wrong number of values are still returned (padded or truncated); they are
 * reported through `warn` as one summary message per table.
 * @param {string[]} lines
 * @param {string[]} fields
 * @param {(msg: string) => void} warn
 * @param {string} label  used in warnings
 * @returns {Record<string, string>[]}
 */
function rowsToObjects(lines, fields, warn, label) {
  let ragged = 0;
  let firstBad = 0;
  const out = lines.map((line, i) => {
    const vals = line.split('|');
    if (vals.length !== fields.length) {
      if (!ragged) firstBad = i + 1;
      ragged++;
    }
    /** @type {Record<string, string>} */
    const obj = {};
    fields.forEach((f, j) => { obj[f] = vals[j] ?? ''; });
    return obj;
  });
  if (ragged) {
    warn(`${label}: ${ragged} of ${lines.length} rows do not have ${fields.length} values (first: row ${firstBad})`);
  }
  return out;
}

class HmtRelease {
  /** @param {string} text  Full text of a CEX release. */
  constructor(text) {
    const { blocks, warnings } = splitBlocks(text);
    /** @type {Block[]} */
    this.blocks = blocks;
    /** @type {string[]} */
    this._warnings = [...warnings];
    /** @type {Map<string, any>} */
    this._cache = new Map();
  }

  /** @param {string} msg */
  _warn(msg) { if (!this._warnings.includes(msg)) this._warnings.push(msg); }

  /**
   * @template T
   * @param {string} key
   * @param {() => T} compute
   * @returns {T}
   */
  _memo(key, compute) {
    if (!this._cache.has(key)) this._cache.set(key, compute());
    return this._cache.get(key);
  }

  /** Block types actually present, in order of first appearance. */
  blockTypes() {
    return [...new Set(this.blocks.map(b => b.type))];
  }

  /**
   * Data lines of all blocks of one type, composited into a single array.
   * For types with one fixed header line (citecollections, citeproperties,
   * datamodels, ctscatalog) the first line of each repeated block is treated
   * as its header and dropped, so the result has a single header line at the
   * start.  For `citedata` and
   * `citerelationset` the composite is a plain concatenation; use `citeData()`
   * or `relationSets()` to get the per-block structure.
   * @param {string} type
   * @returns {string[]}
   */
  getBlock(type) {
    return this._memo('block:' + type, () => {
      const same = this.blocks.filter(b => b.type === type);
      if (!FIXED_HEADER_TYPES.has(type)) return same.flatMap(b => b.lines);
      /** @type {string[]} */
      const out = [];
      for (const b of same) {
        if (out.length === 0) { out.push(...b.lines); continue; }
        // Later blocks repeat the header line; drop it.
        if (b.lines[0] !== out[0]) {
          this._warn(`${type} (line ${b.startLine}): header "${b.lines[0]}" differs from first header "${out[0]}"`);
        }
        out.push(...b.lines.slice(1));
      }
      return out;
    });
  }

  /** The CEX version string, or null if absent. */
  get cexVersion() {
    const lines = this.getBlock('cexversion');
    if (this.blocks.filter(b => b.type === 'cexversion').length > 1) {
      this._warn('more than one #!cexversion block');
    }
    return lines.length ? lines[0].trim() : null;
  }

  /**
   * Library metadata from the `#!citelibrary` block.
   * @returns {{name: string, urn: string, license: string,
   *            namespaces: {abbreviation: string, uri: string}[]}}
   */
  get library() {
    return this._memo('library', () => {
      if (this.blocks.filter(b => b.type === 'citelibrary').length > 1) {
        this._warn('more than one #!citelibrary block');
      }
      const lib = { name: '', urn: '', license: '', namespaces: /** @type {{abbreviation: string, uri: string}[]} */ ([]) };
      for (const line of this.getBlock('citelibrary')) {
        const [key, ...rest] = line.split('|');
        if (key === 'namespace') {
          if (rest.length !== 2) this._warn(`citelibrary: malformed namespace line "${line}"`);
          lib.namespaces.push({ abbreviation: rest[0] ?? '', uri: rest[1] ?? '' });
        } else if (key === 'name' || key === 'urn' || key === 'license') {
          lib[key] = rest.join('|');
        } else {
          this._warn(`citelibrary: unrecognized key "${key}"`);
        }
      }
      return lib;
    });
  }

  /** @returns {{urn: string, description: string, labellingProperty: string, orderingProperty: string, license: string}[]} */
  collections() {
    return this._memo('collections', () => {
      const [, ...rows] = this.getBlock('citecollections');
      return /** @type {any} */ (rowsToObjects(rows,
        ['urn', 'description', 'labellingProperty', 'orderingProperty', 'license'],
        m => this._warn(m), 'citecollections'));
    });
  }

  /** @returns {{urn: string, label: string, type: string, authorityList: string}[]} */
  properties() {
    return this._memo('properties', () => {
      const [, ...rows] = this.getBlock('citeproperties');
      return /** @type {any} */ (rowsToObjects(rows,
        ['urn', 'label', 'type', 'authorityList'], m => this._warn(m), 'citeproperties'));
    });
  }

  /** @returns {{collection: string, model: string, label: string, description: string}[]} */
  dataModels() {
    return this._memo('datamodels', () => {
      const [, ...rows] = this.getBlock('datamodels');
      return /** @type {any} */ (rowsToObjects(rows,
        ['collection', 'model', 'label', 'description'], m => this._warn(m), 'datamodels'));
    });
  }

  /** @returns {Record<string, string>[]}  Keys: urn, citationScheme, groupName, workTitle, versionLabel, exemplarLabel, online, language. */
  ctsCatalog() {
    return this._memo('ctscatalog', () => {
      const [, ...rows] = this.getBlock('ctscatalog');
      return rowsToObjects(rows,
        ['urn', 'citationScheme', 'groupName', 'workTitle', 'versionLabel', 'exemplarLabel', 'online', 'language'],
        m => this._warn(m), 'ctscatalog');
    });
  }

  /**
   * Passages of all `#!ctsdata` blocks.  Each line is split at its first `|`.
   * @returns {{urn: string, text: string}[]}
   */
  ctsData() {
    return this._memo('ctsdata', () => {
      /** @type {{urn: string, text: string}[]} */
      const out = [];
      for (const line of this.getBlock('ctsdata')) {
        const i = line.indexOf('|');
        if (i < 0) { this._warn(`ctsdata: line without "|": "${line.slice(0, 60)}"`); continue; }
        if (line.indexOf('|', i + 1) >= 0) this._warn(`ctsdata: extra "|" in passage ${line.slice(0, i)}`);
        out.push({ urn: line.slice(0, i), text: line.slice(i + 1) });
      }
      return out;
    });
  }

  /**
   * Tables of all `#!citedata` blocks.  Each block has its own header.
   * `collections` lists the distinct collection URNs of the rows' `urn` values.
   * @returns {{header: string[], rows: Record<string, string>[], collections: string[], startLine: number}[]}
   */
  citeData() {
    return this._memo('citedata', () => this.blocks.filter(b => b.type === 'citedata').map(b => {
      const header = (b.lines[0] ?? '').split('|');
      const rows = rowsToObjects(b.lines.slice(1), header, m => this._warn(m), `citedata (line ${b.startLine})`);
      const cols = new Set();
      const urnField = header.find(h => h.toLowerCase() === 'urn');
      if (urnField !== undefined) {
        for (const r of rows) {
          const c = collectionOfObject(r[urnField]);
          if (c) cols.add(c);
        }
      } else if (b.lines.length) {
        this._warn(`citedata (line ${b.startLine}): no "urn" column, collection unknown`);
      }
      return { header, rows, collections: [...cols], startLine: b.startLine };
    }));
  }

  /**
   * Relation sets, one per `#!citerelationset` block: `urn` and `label`
   * key-value lines, then a header line, then rows.
   * @returns {{urn: string, label: string, header: string[], rows: Record<string, string>[], startLine: number}[]}
   */
  relationSets() {
    return this._memo('relationsets', () => this.blocks.filter(b => b.type === 'citerelationset').map(b => {
      let urn = '', label = '';
      let i = 0;
      for (; i < b.lines.length; i++) {
        const [key, ...rest] = b.lines[i].split('|');
        if (key === 'urn' && rest.length === 1 && !urn) urn = rest[0];
        else if (key === 'label' && !label) label = rest.join('|');
        else break;
      }
      if (!urn) this._warn(`citerelationset (line ${b.startLine}): no urn`);
      const header = (b.lines[i] ?? '').split('|');
      const rows = rowsToObjects(b.lines.slice(i + 1), header, m => this._warn(m), `citerelationset ${urn || b.startLine}`);
      return { urn, label, header, rows, startLine: b.startLine };
    }));
  }

  /**
   * Check the release for consistency.  Never throws; returns warnings
   * (including any irregularities noticed while parsing), empty if none.
   * @returns {string[]}
   */
  validate() {
    // Run every typed parser so their warnings are collected.
    this.cexVersion; this.library; this.ctsData();
    const collections = this.collections();
    const properties = this.properties();
    const models = this.dataModels();
    const catalog = this.ctsCatalog();
    const citeData = this.citeData();
    const relSets = this.relationSets();
    const warn = (/** @type {string} */ m) => this._warn(m);

    const collUrns = new Set(collections.map(c => c.urn));
    const propUrns = new Set(properties.map(p => p.urn));
    const propLower = new Set(properties.map(p => p.urn.toLowerCase()));

    for (const c of collections) {
      if (!isCollectionUrn(c.urn)) warn(`citecollections: "${c.urn}" is not a collection-level CITE2 URN`);
      if (!propUrns.has(c.labellingProperty)) {
        warn(`citecollections: labelling property "${c.labellingProperty}" of ${c.urn} is not documented in citeproperties`);
      }
      if (c.orderingProperty && !propUrns.has(c.orderingProperty)) {
        warn(`citecollections: ordering property "${c.orderingProperty}" of ${c.urn} is not documented in citeproperties`);
      }
    }
    for (const p of properties) {
      const c = collectionOfProperty(p.urn);
      if (!c) warn(`citeproperties: "${p.urn}" is not a property-level CITE2 URN`);
      else if (!collUrns.has(c)) warn(`citeproperties: collection ${c} of property ${p.urn} is not documented in citecollections`);
    }
    for (const t of citeData) {
      for (const c of t.collections) {
        if (!collUrns.has(c)) warn(`citedata (line ${t.startLine}): collection ${c} is not documented in citecollections`);
        const undocumented = t.header.filter(name => !propUrns.has(propertyUrn(c, name)))
          .map(name => propLower.has(propertyUrn(c, name).toLowerCase()) ? `${name} (documented with different capitalization)` : name);
        if (undocumented.length) {
          warn(`citedata (line ${t.startLine}): ${undocumented.length} of ${t.header.length} properties of ${c} not documented in citeproperties: ${undocumented.join(', ')}`);
        }
      }
    }
    for (const m of models) {
      if (!collUrns.has(m.collection) && !relSets.some(r => r.urn === m.collection)) {
        warn(`datamodels: ${m.collection} is neither a documented collection nor a relation set`);
      }
    }
    const modelled = new Set(models.map(m => m.collection));
    for (const r of relSets) {
      if (r.urn && !modelled.has(r.urn)) warn(`citerelationset: ${r.urn} has no entry in datamodels`);
    }
    const versions = new Set(catalog.map(c => c.urn));
    const missing = new Set();
    for (const p of this.ctsData()) {
      const w = ctsWorkOf(p.urn);
      const v = ctsVersionOf(p.urn);
      if (!(w && versions.has(w)) && !(v && versions.has(v))) missing.add(w ?? p.urn);
    }
    for (const v of missing) warn(`ctsdata: no ctscatalog entry for version ${v}`);

    return [...this._warnings];
  }
}

// ---------------------------------------------------------------------------
// Loading
// ---------------------------------------------------------------------------

/** Parse release text. */
function parseRelease(text) {
  return new HmtRelease(text);
}

/**
 * Fetch and parse a release.  Works when the page is served over http(s);
 * browsers block fetch from file:// pages, where apps should instead use
 * `readReleaseFile` with a file picker or drop target.
 * @param {string} [url]
 */
async function fetchRelease(url = DEFAULT_RELEASE_URL) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`Could not load ${url}: HTTP ${resp.status}`);
  return parseRelease(await resp.text());
}

/** Parse a release from a `File`/`Blob` (file picker or drag-and-drop). */
async function readReleaseFile(file) {
  return parseRelease(await file.text());
}

 * Convention for inlining (see scripts/build.js): imports are single-line.

 * Passages of one text (a version or exemplar), in the order of the release.
 * @typedef {Object} TextIndex
 * @property {string} urn                     Work-component URN, ending in ":".
 * @property {string[]} refs                  Passage references, in order.
 * @property {string[]} texts                 Passage text, parallel to `refs`.
 * @property {Map<string, number>} pos        Reference -> position in `refs`.

  const parts = workUrn.split(':')[3].split('.');

/**
 * Index every text in the release by work-component URN.  The order of
 * passages in the release is the order of the text (references like
 * `1.title` or `6.386del` do not sort numerically).

 * @returns {Map<string, TextIndex>}

function buildTextIndex(release) {
  /** @type {Map<string, TextIndex>} */
  const map = new Map();
  for (const { urn, text } of release.ctsData()) {
    const m = /^(urn:cts:[^:]+:[^:]+:)(.*)$/.exec(urn);
    if (!m) continue;
    let t = map.get(m[1]);
    if (!t) { t = { urn: m[1], refs: [], texts: [], pos: new Map() }; map.set(m[1], t); }

}

/** @type {WeakMap<Map<string, TextIndex>, Map<string, {urn: string, kind: string}[]>>} */
const versionTexts = new WeakMap();

/**
 * The texts (exemplars, or the version itself) available for a version URN,
 * `normalized` first.
 * @param {Map<string, TextIndex>} textIndex
 * @param {string} versionUrn  e.g. `urn:cts:greekLit:tlg0012.tlg001.msA:`
 * @returns {{urn: string, kind: string}[]}

function textsOfVersion(textIndex, versionUrn) {
  let byVersion = versionTexts.get(textIndex);
  if (!byVersion) {
    byVersion = new Map();
    for (const key of textIndex.keys()) {
      const v = ctsVersionOf(key);
      if (!v) continue;
      const list = byVersion.get(v) ?? [];
      list.push({ urn: key, kind: exemplarName(key) });
      byVersion.set(v, list);
    }
    const rank = (/** @type {string} */ k) => KIND_ORDER.indexOf(k) + 1 || 99;
    for (const list of byVersion.values()) list.sort((a, b) => rank(a.kind) - rank(b.kind));

/**
 * Text of a passage, from the exemplar of the requested kind when the version
 * has one (otherwise the first available).  A passage with its own text gives
 * one part with an empty `part` name; a scholion, whose text is stored as
 * `<ref>.lemma` and `<ref>.comment`, gives those parts.  Nothing found gives
 * no parts.
 * @param {Map<string, TextIndex>} textIndex
 * @param {string} urn   Passage URN at version level, e.g. `urn:cts:greekLit:tlg0012.tlg001.msA:1.1`.
 * @param {string} kind  `diplomatic` or `normalized`.
 * @returns {{parts: {part: string, text: string}[]}}
 */
function passageText(textIndex, urn, kind) {
  const m = /^(urn:cts:[^:]+:[^:]+:)(.*)$/.exec(urn);
  if (!m) return { parts: [] };
  const version = ctsVersionOf(m[1]);
  const texts = version ? textsOfVersion(textIndex, version) : [];
  const pick = texts.find(t => t.kind === kind) ?? texts[0];
  const t = pick ? textIndex.get(pick.urn) : undefined;
  if (!t) return { parts: [] };
  const direct = t.pos.get(m[2]);
  if (direct !== undefined) return { parts: [{ part: '', text: t.texts[direct] }] };
  /** @type {{part: string, text: string}[]} */
  const parts = [];
  for (const part of ['lemma', 'comment']) {
    const i = t.pos.get(m[2] + '.' + part);
    if (i !== undefined) parts.push({ part, text: t.texts[i] });
  }
  return { parts };
}

/**

 * passages to regions of interest (ROI) on manuscript images.
 * No DOM access.
 */

/** Relation set linking passages, image regions, and manuscript surfaces. */
const DSE_URN = 'urn:cite2:hmt:hmtdse.v1:all';

/**
 * @typedef {Object} Roi
 * @property {number} x  Left edge, as a fraction (0–1) of the image width.
 * @property {number} y  Top edge, as a fraction of the image height.
 * @property {number} w  Width, as a fraction of the image width.
 * @property {number} h  Height, as a fraction of the image height.

/**
 * Parse `x,y,w,h` (fractions of the image size).  Whitespace around values
 * is tolerated.  Returns null if there are not four numbers, or the region is
 * empty or lies outside the image.  A region that sticks out past the right or
 * bottom edge by up to 0.02 of the image size (rounding in the source data,
 * e.g. x+w = 1.004) is clipped to the image.

 * @returns {Roi | null}

  if (x < 0 || y < 0 || !(w > 0) || !(h > 0) || x + w > 1 + eps || y + h > 1 + eps) return null;

 * `urn:cite2:hmt:vaimg.2017a:VA012RN_0013@0.0611,0.2252,0.4675,0.0901`.

  fit() {
    if (!this.image) return;
    const { w, h } = this.measure();
    const t = fitTransform(w, h, this.image.width, this.image.height);
    this.minScale = t.sc;
    this.set(t);
  }

  /** Zoom by a factor around the view centre (or a given screen point). */
  zoomBy(/** @type {number} */ factor, /** @type {number} */ px = this.size.w / 2, /** @type {number} */ py = this.size.h / 2) {
    this.set(zoomAt(this.t, factor, px, py, this.minScale, MAX_SCALE));
  }

  /** Pan by screen pixels. */
  panBy(/** @type {number} */ dx, /** @type {number} */ dy) {
    this.set({ sc: this.t.sc, tx: this.t.tx + dx, ty: this.t.ty + dy });
  }

  /** Screen point (relative to the viewer) of an image point. */
  toScreen(/** @type {number} */ x, /** @type {number} */ y) {
    return imageToScreen(this.t, x, y);
  }

  destroy() {
    this.ro.disconnect();
    cancelAnimationFrame(this.raf);
    this.root.textContent = '';
  }

  // --- internals -----------------------------------------------------------

  measure() {
    const r = this.root.getBoundingClientRect();
    this.size.w = r.width;
    this.size.h = r.height;
    this.size.dpr = window.devicePixelRatio || 1;
    return this.size;
  }

  onResize() {
    const before = { w: this.size.w, h: this.size.h };
    this.measure();
    if (!this.image) return;
    const atFit = Math.abs(this.t.sc - this.minScale) < 1e-9;
    const fitNow = fitTransform(this.size.w, this.size.h, this.image.width, this.image.height);
    this.minScale = fitNow.sc;
    if (atFit || before.w === 0) this.set(fitNow);
    else this.set(this.t);
  }

  set(/** @type {{sc: number, tx: number, ty: number}} */ t) {
    if (!this.image) { this.t = t; return; }
    this.t = clampTransform(t, this.size.w, this.size.h, this.image.width, this.image.height, this.minScale, MAX_SCALE);
    this.overlay.setAttribute('transform', `translate(${this.t.tx} ${this.t.ty}) scale(${this.t.sc})`);
    this.schedule();
  }

  schedule() {
    if (!this.raf) this.raf = requestAnimationFrame(() => { this.raf = 0; this.draw(); });
  }

  draw() {
    const { w, h, dpr } = this.size;
    const cw = Math.round(w * dpr), ch = Math.round(h * dpr);
    if (this.canvas.width !== cw || this.canvas.height !== ch) { this.canvas.width = cw; this.canvas.height = ch; }
    const ctx = this.ctx;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    if (!this.image) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const { sc, tx, ty } = this.t;
    const { width: W, height: H } = this.image;

    for (const img of this.layers) ctx.drawImage(img, tx, ty, W * sc, H * sc);

    const level = chooseLevel(sc, dpr, maxLevel(W, H));
    const tiles = visibleTiles(this.t, w, h, W, H, level);
    /** @type {{key: string, tile: any}[]} */
    const wanted = [];
    const now = Date.now();
    for (const tile of tiles) {
      const key = `${tile.level}/${tile.i}/${tile.j}`;
      const entry = this.tiles.get(key);
      if (entry && entry.state === 'loaded') {
        ctx.drawImage(entry.img, tx + tile.x * sc, ty + tile.y * sc, tile.w * sc, tile.h * sc);
        this.tiles.delete(key); this.tiles.set(key, entry);      // mark recently used
      } else if (!entry || (entry.state === 'error' && now - entry.at > RETRY_MS)) {
        wanted.push({ key, tile });
      }
    }
    const cx = (w / 2 - tx) / sc, cy = (h / 2 - ty) / sc;
    wanted.sort((a, b) =>
      Math.hypot(a.tile.x + a.tile.w / 2 - cx, a.tile.y + a.tile.h / 2 - cy) -
      Math.hypot(b.tile.x + b.tile.w / 2 - cx, b.tile.y + b.tile.h / 2 - cy));
    this.wanted = wanted;
    this.pump();
  }

  pump() {
    const image = this.image;
    if (!image) return;
    while (this.inflight < MAX_INFLIGHT && this.wanted.length) {
      const next = this.wanted.shift();
      if (!next) break;
      const { key, tile } = next;
      if (this.tiles.get(key)?.state === 'loading') continue;
      const img = new Image();
      const entry = { img, state: 'loading', at: Date.now() };
      this.tiles.set(key, entry);
      const gen = this.gen;
      this.inflight++;
      const done = (/** @type {string} */ state) => {
        if (gen !== this.gen) return;
        this.inflight--;
        entry.state = state; entry.at = Date.now();
        this.evict();
        this.schedule();
      };
      img.onload = () => done('loaded');
      img.onerror = () => done('error');
      img.decoding = 'async';
      img.src = image.urlFor(`${tile.x},${tile.y},${tile.w},${tile.h}`, `${tile.outW},`);
    }
  }

  evict() {
    if (this.tiles.size <= MAX_CACHED_TILES) return;
    for (const [key, entry] of this.tiles) {
      if (this.tiles.size <= MAX_CACHED_TILES) break;
      if (entry.state !== 'loading') this.tiles.delete(key);
    }
  }

  bind() {
    const root = this.root;
    const local = (/** @type {MouseEvent} */ e) => {
      const r = root.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    };

    root.addEventListener('pointerdown', e => {
      if (e.button !== 0 && e.pointerType === 'mouse') return;
      root.setPointerCapture(e.pointerId);
      const p = local(e);
      this.pointers.set(e.pointerId, p);
      if (this.pointers.size === 1) { this.downAt = p; this.moved = false; }
      if (this.pointers.size === 2) {
        const [a, b] = [...this.pointers.values()];
        this.pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
        this.moved = true;
      }
    });

    root.addEventListener('pointermove', e => {
      const prev = this.pointers.get(e.pointerId);
      if (!prev) return;
      const p = local(e);
      this.pointers.set(e.pointerId, p);
      if (this.pointers.size === 1) {
        if (!this.moved && Math.hypot(p.x - this.downAt.x, p.y - this.downAt.y) < 4) return;
        this.moved = true;
        this.dragging = true;
        root.classList.add('dragging');
        this.panBy(p.x - prev.x, p.y - prev.y);
      } else if (this.pointers.size === 2) {
        const [a, b] = [...this.pointers.values()];
        const dist = Math.hypot(a.x - b.x, a.y - b.y);
        if (this.pinchDist > 0) this.zoomBy(dist / this.pinchDist, (a.x + b.x) / 2, (a.y + b.y) / 2);
        this.pinchDist = dist;
        this.dragging = true;
      }
    });

    const up = (/** @type {PointerEvent} */ e) => {
      if (!this.pointers.delete(e.pointerId)) return;
      if (this.pointers.size === 0) {
        // Clear after the click that ends a drag has been dispatched.
        setTimeout(() => { this.dragging = false; root.classList.remove('dragging'); }, 0);
      }
      this.pinchDist = 0;
    };
    root.addEventListener('pointerup', up);
    root.addEventListener('pointercancel', up);

    root.addEventListener('wheel', e => {
      e.preventDefault();
      const p = local(e);
      this.zoomBy(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), p.x, p.y);
    }, { passive: false });

    root.addEventListener('dblclick', e => {
      const p = local(e);
      this.zoomBy(e.shiftKey ? 0.5 : 2, p.x, p.y);
    });

    root.addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const step = 80;
      const handled = {
        '+': () => this.zoomBy(1.4), '=': () => this.zoomBy(1.4), '-': () => this.zoomBy(1 / 1.4), '_': () => this.zoomBy(1 / 1.4),
        '0': () => this.fit(),
        ArrowLeft: () => this.panBy(step, 0), ArrowRight: () => this.panBy(-step, 0),
        ArrowUp: () => this.panBy(0, step), ArrowDown: () => this.panBy(0, -step),
      }[e.key];
      if (handled) { e.preventDefault(); handled(); }
    });
  }
}

</script>
<script>
// Browser UI for the codices app: choose a codex, then a page; the page image
// of the DSE records is shown with a rectangle over each indexed text passage,
// hovering a rectangle shows the diplomatic text, and clicking it copies the
// text to the clipboard.  Uses the shared sources
// inlined ahead of this file (see index.html).
//
// Address: `?page=<page URN>`, or `?image=<image URN>` or `?text=<passage URN>`, which are turned into a page through
// the DSE records and the catalog (no `#`); the address is rewritten as `?page=…`.  Links, bookmarks and Back work.
(function () {
  const $ = id => document.getElementById(id);
  const proto = location.protocol;
  const THUMB_W = 240;
  const TIP_MAX_CHARS = 700;
  const TIP_MAX_ITEMS = 4;
  const NS = 'http://www.w3.org/2000/svg';
  const KIND = 'diplomatic';

  /** @type {Codex[]} */ let books = [];
  /** @type {Codex | null} */ let book = null;
  /** @type {any} */ let release = null;
  /** @type {any} */ let locator = null;
  /** @type {Map<string, any>} */ let textIndex = new Map();
  /** @type {Map<string, string>} */ let titles = new Map();
  /** @type {Map<string, PageRegion[]>} */ let bySurface = new Map();
  /** @type {Set<string>} */ let catalogImages = new Set();
  /** @type {Map<string, Promise<{width: number, height: number}>>} */ const sizes = new Map();
  /** @type {any} */ let viewer = null;
  let current = -1;            // index of the page in `book.pages`
  let openToken = 0;
  let lastTipKey = '';

  const plural = (n, one, many) => `${n.toLocaleString('en')} ${n === 1 ? one : many}`;
  const urlFor = (service, region, size) => matchProtocol(iiifImageUrl(service, region, size), proto);
  const setStatus = msg => { $('status').textContent = msg; };
  const regionsOn = p => bySurface.get(p.urn) ?? [];

  // --- loading ---------------------------------------------------------------

  function start(rel) {
    release = rel;
    textIndex = buildTextIndex(rel);
    titles = catalogTitles(rel);
    bySurface = indexRegionsBySurface(rel).bySurface;
    catalogImages = new Set(imageCollections(rel).flatMap(c => c.items.map(i => i.urn)));
    books = codices(rel);
    locator = createLocator(rel);
    book = null; current = -1;
    const sel = $('codex');
    sel.textContent = '';
    sel.appendChild(new Option('Choose a codex…', ''));
    for (const c of books) {
      const n = c.pages.filter(p => pageView(p, regionsOn(p), catalogImages).regions.length).length;
      const o = new Option(`${c.label} (${plural(c.pages.length, 'page', 'pages')}${n ? `, ${n.toLocaleString('en')} with indexed text` : ', no indexed text'})`, c.urn);
      o.disabled = c.pages.length === 0;
      sel.appendChild(o);
    }
    sel.disabled = books.length === 0;
    setStatus(books.length ? `${rel.library.name}: ${plural(books.length, 'codex', 'codices')}` : `${rel.library.name}: no codices found`);
    $('drop').hidden = true;
    route();
  }

  function showProblem(msg) {
    setStatus('');
    $('problem').textContent = msg;
    $('drop').hidden = false;
  }

  async function loadFile(file) {
    setStatus(`Reading ${file.name}…`);
    try { start(await readReleaseFile(file)); }
    catch (e) { showProblem(`${file.name}: ${e.message || e}`); }
  }

  // --- menus -------------------------------------------------------------------

  function chooseCodex(urn) {
    book = books.find(c => c.urn === urn) ?? null;
    const sel = $('page');
    sel.textContent = '';
    if (!book) { sel.disabled = true; return; }
    sel.appendChild(new Option('Choose a page…', ''));
    book.pages.forEach((p, i) => {
      const n = pageView(p, regionsOn(p), catalogImages).regions.length;   // regions that will be drawn
      // "●" marks pages with indexed text; a figure space keeps the others aligned with them
      sel.appendChild(new Option(n ? `● ${p.short} · ${n}` : `\u2007  ${p.short}`, String(i)));
    });
    sel.disabled = false;
  }

  function syncControls() {
    $('codex').value = book ? book.urn : '';
    $('page').value = book && current >= 0 ? String(current) : '';
    $('prev').disabled = !book || current <= 0;
    $('next').disabled = !book || current < 0 || current >= book.pages.length - 1;
  }

  // --- navigation (address of the page) ----------------------------------------------

  /** Show a page (by URN) and put it in the address of the page. */
  function go(urn, replace) {
    setQuery({ page: urn }, replace);
    showPage(urn);
  }

  function route() {
    const r = resolvePage(locator, readParams(location.search));
    if (!r) { clear(); return; }
    if ('error' in r) { clear(); setStatus(`${release.library.name}: ${r.error}`); return; }
    if (decodeURIComponent(location.search) !== `?page=${r.page}`) setQuery({ page: r.page }, true);   // the canonical address
    showPage(r.page);
  }

  function clear() {
    openToken++;
    if (viewer) viewer.close();
    current = -1;
    hideTip();
    $('intro').hidden = false;
    $('viewer-note').hidden = true;
    $('viewer-error').hidden = true;
    document.title = 'Codices';
    syncControls();
  }

  // --- the page ------------------------------------------------------------------

  /** Pixel size of an image, from its IIIF info.json (asked once per image). */
  function imageSize(service) {
    let p = sizes.get(service);
    if (!p) {
      p = fetch(matchProtocol(`${service}/info.json`, proto))
        .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
        .then(j => parseInfo(j) || Promise.reject(new Error('no width and height in the image information')));
      p.catch(() => sizes.delete(service));
      sizes.set(service, p);
    }
    return p;
  }

  async function showPage(urn) {
    const owner = books.find(c => c.urn === (collectionOfObject(urn) ?? ''));
    const idx = owner ? owner.pages.findIndex(p => p.urn === urn) : -1;
    if (idx < 0) { clear(); setStatus(`${release.library.name}: no page ${urn} in this release`); return; }
    if (owner !== book) chooseCodex(owner.urn);
    current = idx;
    syncControls();
    const page = book.pages[idx];
    const token = ++openToken;
    $('intro').hidden = true;
    $('viewer-error').hidden = true;
    hideTip();
    document.title = `${page.label || page.id} – Codices`;
    const view = pageView(page, regionsOn(page), catalogImages);
    if (!viewer) { viewer = new IiifViewer($('viewer')); viewer.overlay.id = 'rois'; bindHover(); }
    viewer.close();
    const note = $('viewer-note');
    note.hidden = false;
    note.textContent = page.label || page.id;
    const service = view.image ? imageService(view.image) : null;
    try {
      if (!service) throw new Error(view.image ? `cannot work out where ${view.image} is served` : 'the release names no image for this page');
      const { width, height } = await imageSize(service);
      if (token !== openToken) return;
      viewer.open({
        width, height,
        urlFor: (region, size) => urlFor(service, region, size),
        placeholders: [urlFor(service, 'full', `${THUMB_W},`)],
      });
      drawRegions(view.regions, width, height);
      viewer.root.focus({ preventScroll: true });
      const bits = [page.label || page.id];
      if (view.regions.length) bits.push(plural(view.regions.length, 'indexed passage', 'indexed passages'));
      else bits.push(release && view.source !== 'none' ? 'no indexed text on this page' : '');
      if (view.elsewhere) bits.push(`${plural(view.elsewhere, 'region', 'regions')} on another image not shown`);
      note.textContent = bits.filter(Boolean).join(' · ');
    } catch (e) {
      if (token !== openToken) return;
      $('viewer-error').textContent = `Could not load the image of ${page.label || page.id} (${e.message || e}).`;
      $('viewer-error').hidden = false;
    }
  }

  function drawRegions(regions, width, height) {
    const overlay = viewer.overlay;
    overlay.textContent = '';
    const frag = document.createDocumentFragment();
    for (const r of regions) {
      const rect = document.createElementNS(NS, 'rect');
      const p = roiToRect(r.roi, width, height);
      rect.setAttribute('x', p.x); rect.setAttribute('y', p.y);
      rect.setAttribute('width', p.w); rect.setAttribute('height', p.h);
      rect.setAttribute('class', `roi ${passageKind(r.passage)}`);
      rect.dataset.passage = r.passage;
      frag.appendChild(rect);
    }
    overlay.appendChild(frag);
    applyLayers();
  }

  function applyLayers() {
    if (!viewer) return;
    for (const k of ['iliad', 'scholia', 'other']) viewer.overlay.classList.toggle(`hide-${k}`, !$(`show-${k}`).checked);
    hideTip();
  }

  // --- hover tooltip ---------------------------------------------------------------

  function hideTip() {
    $('tip').hidden = true;
    lastTipKey = '';
    if (viewer) for (const el of viewer.overlay.querySelectorAll('.hot')) el.classList.remove('hot');
  }

  function renderTipItem(passage) {
    const div = document.createElement('div');
    div.className = 'item';
    const what = document.createElement('div');
    what.className = 'what';
    const b = document.createElement('b');
    b.textContent = passageLabel(passage, titles);
    what.appendChild(b);
    div.appendChild(what);
    const body = document.createElement('div');
    body.className = 'greek'; body.lang = 'grc';
    const { parts } = passageText(textIndex, passage, KIND);
    if (!parts.length) {
      body.className = 'none';
      body.textContent = 'Text not available in this release.';
    } else {
      let remaining = TIP_MAX_CHARS;
      for (const p of parts) {
        if (remaining <= 0) break;
        const text = p.text.length > remaining ? p.text.slice(0, remaining) + '…' : p.text;
        remaining -= text.length;
        const span = document.createElement('span');
        if (p.part === 'lemma') span.className = 'lemma';
        span.textContent = text;
        if (body.childNodes.length) body.append(' ');
        body.appendChild(span);
      }
    }
    div.appendChild(body);
    return div;
  }

  /** Full diplomatic text of a passage (lemma and comment of a scholion with a space between), or "". */
  function passageString(passage) {
    return passageText(textIndex, passage, KIND).parts.map(p => p.text).join(' ');
  }

  /** Copy to the clipboard; falls back to a hidden textarea where the clipboard API is missing (e.g. some file:// pages). */
  async function copyText(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { await navigator.clipboard.writeText(text); return true; }
    } catch (e) { /* try the fallback */ }
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }

  let toastTimer = 0;
  function toast(msg, bad) {
    const t = $('copied');
    t.textContent = msg;
    t.classList.toggle('bad', !!bad);
    t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
  }

  /** Copy the text of the topmost rectangle under the pointer. */
  async function copyAt(clientX, clientY) {
    const el = document.elementsFromPoint(clientX, clientY).find(e => e.classList && e.classList.contains('roi'));
    if (!el) return;
    const passage = el.dataset.passage;
    const label = passageLabel(passage, titles);
    const text = passageString(passage);
    if (!text) { toast(`No text of ${label} in this release`, true); return; }
    toast((await copyText(text)) ? `Copied ${label} to the clipboard` : `Could not copy ${label}`, false);
  }

  function showTipAt(clientX, clientY) {
    const els = document.elementsFromPoint(clientX, clientY).filter(el => el.classList && el.classList.contains('roi'));
    const key = els.map(el => el.dataset.passage).join('\n');
    const tip = $('tip');
    if (!els.length) { hideTip(); return; }
    if (key !== lastTipKey) {
      lastTipKey = key;
      for (const el of viewer.overlay.querySelectorAll('.hot')) el.classList.remove('hot');
      for (const el of els) el.classList.add('hot');
      tip.textContent = '';
      for (const el of els.slice(0, TIP_MAX_ITEMS)) tip.appendChild(renderTipItem(el.dataset.passage));
      if (els.length > TIP_MAX_ITEMS) {
        const more = document.createElement('div');
        more.className = 'what'; more.textContent = `+ ${els.length - TIP_MAX_ITEMS} more here`;
        tip.appendChild(more);
      }
    }
    tip.hidden = false;
    const wrap = $('viewer-wrap').getBoundingClientRect();
    const x0 = clientX - wrap.left, y0 = clientY - wrap.top;
    let x = x0 + 14, y = y0 + 18;
    if (x + tip.offsetWidth > wrap.width - 4) x = x0 - 14 - tip.offsetWidth;
    if (y + tip.offsetHeight > wrap.height - 4) y = y0 - 14 - tip.offsetHeight;
    tip.style.left = Math.max(4, x) + 'px';
    tip.style.top = Math.max(4, y) + 'px';
  }

  function bindHover() {
    const root = viewer.root;
    let pending = null;
    root.addEventListener('pointermove', e => {
      if (e.pointerType !== 'mouse' || viewer.dragging) return;
      pending = e;
      requestAnimationFrame(() => { if (pending) { showTipAt(pending.clientX, pending.clientY); pending = null; } });
    });
    root.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { pending = null; hideTip(); } });
    root.addEventListener('pointerdown', () => { if (viewer.pointers.size === 0) $('tip').hidden = true; });
    root.addEventListener('click', e => {
      if (viewer.dragging) return;
      if (e.pointerType !== 'mouse') showTipAt(e.clientX, e.clientY);   // touch has no hover: a tap shows the text too
      copyAt(e.clientX, e.clientY);
    });
    root.addEventListener('wheel', () => hideTip(), { passive: true });
  }

  // --- wiring ----------------------------------------------------------------------

  $('codex').addEventListener('change', e => {
    const urn = e.target.value;
    chooseCodex(urn);
    current = -1;
    if (urn) { openToken++; if (viewer) viewer.close(); syncControls(); $('intro').hidden = false; $('viewer-note').hidden = true; $('viewer-error').hidden = true; hideTip(); }
    else { setQuery({}, false); clear(); }
    $('intro').textContent = urn ? 'Choose a page. Hover over a rectangle to read its text; click to copy it.' : 'Choose a codex, then a page. Hover over a rectangle to read its text; click to copy it.';
    if (urn) setQuery({}, true);
  });
  $('page').addEventListener('change', e => {
    if (e.target.value !== '' && book) go(book.pages[Number(e.target.value)].urn, false);
  });
  const step = d => { if (book && current >= 0 && book.pages[current + d]) go(book.pages[current + d].urn, true); };
  $('prev').addEventListener('click', () => step(-1));
  $('next').addEventListener('click', () => step(1));
  $('zoom-in').addEventListener('click', () => viewer && viewer.zoomBy(1.5));
  $('zoom-out').addEventListener('click', () => viewer && viewer.zoomBy(1 / 1.5));
  $('fit').addEventListener('click', () => viewer && viewer.fit());
  for (const k of ['iliad', 'scholia', 'other']) $(`show-${k}`).addEventListener('change', applyLayers);

  window.addEventListener('popstate', () => { if (books.length) route(); });   // Back, Forward
  document.addEventListener('keydown', e => {
    if (current < 0 || e.target.closest('input, select') || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === '[' || e.key === 'PageUp') { e.preventDefault(); step(-1); }
    else if (e.key === ']' || e.key === 'PageDown') { e.preventDefault(); step(1); }
  });

  $('file').addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });
  window.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
  window.addEventListener('dragleave', () => document.body.classList.remove('dragging'));
  window.addEventListener('drop', e => {
    e.preventDefault(); document.body.classList.remove('dragging');
    if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
  });

  (async function init() {
    try { start(await fetchRelease()); }
    catch (e) { showProblem(`Could not load the HMT release (${e.message || e}). If you are offline, load a copy of the release from your computer.`); }
  })();
})();

</script>
</body>
</html>
