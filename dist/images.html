<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-version" content="0.5.1">
<title>Images</title>
<style>
  :root {
    --bg: #fbfaf7; --fg: #1f1d1a; --muted: #6b655c; --line: #e4dfd5; --panel: #ffffff;
    --c-iliad: #e0452c; --c-scholia: #2f7de1; --c-other: #2fa36b;
    --accent: #8a2f1d; --accent-fg: #fff; --focus: #2a5bd7; --err: #a3201a;
    --table: #2b2a28; --table-fg: #ece7de; --cell: #3a3835;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1a1816; --fg: #ece7de; --muted: #a39b8d; --line: #3a362f; --panel: #23201d;
            --accent: #e0896f; --accent-fg: #1a1816; --focus: #8fb0ff; --err: #ff8a80;
            --table: #121110; --cell: #23211f; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; }
  header { display: flex; flex-wrap: wrap; gap: .25rem 1rem; align-items: baseline; padding: .6rem 1rem; border-bottom: 1px solid var(--line); }
  h1 { font-size: 1.15rem; margin: 0; }
  #status { color: var(--muted); font-size: .875rem; }
  .appmeta { order: -1; flex: 0 0 100%; display: flex; justify-content: flex-end; flex-wrap: wrap; gap: .25rem 1rem; font-size: .875rem; color: var(--muted); }
  .appmeta .home { margin-right: auto; }
  .appmeta a { color: var(--accent); }
  button, select, input { font: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--fg); border-radius: 6px; padding: .3rem .7rem; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  select, input[type=number] { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); padding: .3rem .5rem; }
  [hidden] { display: none !important; }

  /* ---- light box ---- */
  #table-view { flex: 1; overflow: auto; background: var(--table); color: var(--table-fg); display: flex; flex-direction: column; }
  #controls { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: .5rem 1.25rem; align-items: center;
         padding: .6rem 1rem; background: var(--bg); color: var(--fg); border-bottom: 1px solid var(--line); }
  #controls label { display: inline-flex; gap: .4rem; align-items: center; }
  #controls .coll { flex: 1 1 20rem; min-width: 0; }
  #collection { flex: 1; min-width: 0; width: 100%; }
  #find { padding: .3rem .5rem; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--fg); width: 11rem; }
  #shown { color: var(--muted); font-size: .875rem; }
  #intro, #note { padding: 2rem 1rem; text-align: center; color: var(--table-fg); opacity: .8; }
  #note { padding: .75rem 1rem 0; color: #ffb4a8; opacity: 1; }
  #grid { --cell-w: 170px; display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--cell-w), 1fr));
          gap: .75rem; padding: 1rem; }
  .cell { display: flex; flex-direction: column; gap: .3rem; align-items: stretch; padding: .4rem; border: 1px solid transparent;
          border-radius: 6px; background: var(--cell); color: inherit; text-align: center; }
  .cell:hover { border-color: var(--accent); }
  .cell .thumb { display: grid; place-items: center; width: 100%; aspect-ratio: 3 / 4; background: #0003; overflow: hidden; }
  .cell img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
  .cell .thumb.missing img { display: none; }
  .cell .thumb.missing::after { content: "no image"; font-size: .75rem; opacity: .6; }
  .cell .lbl { font-size: .8125rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #empty { padding: 1rem; text-align: center; color: var(--table-fg); opacity: .8; }

  /* ---- viewer ---- */
  #viewer-view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #viewer-bar { display: flex; flex-wrap: wrap; gap: .4rem .9rem; align-items: center; padding: .5rem 1rem;
         border-bottom: 1px solid var(--line); background: var(--bg); }
  #viewer-title { font-weight: 600; flex: 1 1 10rem; min-width: 0; }
  #viewer-count { color: var(--muted); font-size: .875rem; }
  .group { display: inline-flex; gap: .4rem; align-items: center; }
  .group[hidden] { display: none; }
  .group label { display: inline-flex; gap: .3rem; align-items: center; font-size: .875rem; }
  .chip { width: .8rem; height: .8rem; border-radius: 2px; display: inline-block; border: 2px solid; }
  .chip.iliad { border-color: var(--c-iliad); background: color-mix(in srgb, var(--c-iliad) 20%, transparent); }
  .chip.scholia { border-color: var(--c-scholia); background: color-mix(in srgb, var(--c-scholia) 20%, transparent); }
  .chip.other { border-color: var(--c-other); background: color-mix(in srgb, var(--c-other) 20%, transparent); }
  #rights { padding: .5rem 1rem; border-bottom: 1px solid var(--line); background: var(--panel); font-size: .875rem; color: var(--muted); }
  #viewer-wrap { position: relative; flex: 1; min-height: 0; background: #1b1a19; }
  #viewer { position: absolute; inset: 0; cursor: grab; outline-offset: -2px; }
  #viewer-note { position: absolute; left: .75rem; bottom: .6rem; background: #000a; color: #fff; padding: .15rem .5rem;
         border-radius: 4px; font-size: .8125rem; pointer-events: none; max-width: calc(100% - 1.5rem); }
  #viewer-error { position: absolute; inset: 0; display: grid; place-items: center; padding: 1rem; text-align: center; color: #ffb4a8; }

  /* ---- loading / errors ---- */
  #drop { margin: 1rem; padding: 1rem; border: 2px dashed var(--line); border-radius: 8px; text-align: center; color: var(--muted);
          background: var(--bg); }
  body.dragging #drop { border-color: var(--accent); }
  #drop input[type=file] { max-width: 100%; }
  #problem { color: var(--err); }
  @media (max-width: 40rem) { header { padding: .5rem .75rem; } #controls { padding: .5rem .75rem; } #find { width: 8rem; } #grid { --cell-w: 130px; gap: .5rem; padding: .75rem; } }
</style>
<style>
/* Regions of interest drawn on an image (roi-tool.js) and their list (roi-panel.js). */
.iiif-viewer.roi-draw { cursor: crosshair; }
#viewer.roi-draw, #viewer.roi-draw.dragging { cursor: crosshair; }   /* more specific than the apps' own `#viewer { cursor: grab }` */
.iiif-viewer.roi-shift, .iiif-viewer.roi-shift * { cursor: crosshair !important; }   /* Shift held over the image, or a Shift-drag: draws, whatever is under the pointer */
.roi-layer .user-roi { fill: #ffd23f; fill-opacity: .14; stroke: #ffd23f; stroke-width: 2px; vector-effect: non-scaling-stroke; pointer-events: none; }
.roi-layer .user-roi.current { fill: #ff4fd8; stroke: #ff4fd8; fill-opacity: .16; }
.roi-layer.selecting .user-roi { pointer-events: all; cursor: move; }
.roi-layer .user-roi-label { fill: #ffd23f; font-family: system-ui, sans-serif; font-weight: 700; paint-order: stroke; stroke: #000; stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
.roi-layer .user-roi-label.current { fill: #ff4fd8; }
.roi-layer .user-roi-handle { fill: #ff4fd8; stroke: #111; stroke-width: 1px; vector-effect: non-scaling-stroke; pointer-events: all; }
.roi-layer .user-roi-handle.nw, .roi-layer .user-roi-handle.se { cursor: nwse-resize; }
.roi-layer .user-roi-handle.ne, .roi-layer .user-roi-handle.sw { cursor: nesw-resize; }
#roi-select.on { background: #ff4fd8; border-color: #ff4fd8; color: #111; }
#roi-panel { border-top: 1px solid var(--line); background: var(--panel); padding: .4rem 1rem .5rem; max-height: 11rem; overflow: auto; font-size: .875rem; }
#roi-panel .roi-head { font-size: .875rem; margin: 0 0 .25rem; }
#roi-panel .roi-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .25rem; }
#roi-panel .roi-list li { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; padding: .1rem .25rem; border-radius: 4px; }
#roi-panel .roi-list li.current { background: color-mix(in srgb, #ff4fd8 22%, transparent); }
#roi-panel .roi-num { min-width: 1.6rem; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 4px; }
#roi-panel .roi-urn { word-break: break-all; user-select: all; flex: 1 1 14rem; }
#roi-panel .roi-btn { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 4px; padding: .05rem .5rem; }
#roi-panel .roi-btn:hover { border-color: var(--accent); }
#roi-panel .roi-actions { display: flex; gap: .4rem; margin-top: .3rem; }
#roi-panel .roi-hint { margin: .3rem 0 0; color: var(--muted); font-size: .8125rem; }
</style>
<style>
/* Indexed text on an image (text-regions.js): rectangles, tooltip, copy message.  Needs --c-iliad, --c-scholia, --c-other. */
  .roi { fill-opacity: .13; stroke-width: 1.5px; vector-effect: non-scaling-stroke; pointer-events: all; }
  .roi.iliad { fill: var(--c-iliad); stroke: var(--c-iliad); }
  .roi.scholia { fill: var(--c-scholia); stroke: var(--c-scholia); }
  .roi.other { fill: var(--c-other); stroke: var(--c-other); }
  .roi.hot { fill-opacity: .38; stroke-width: 3px; }
  #rois.hide-iliad .roi.iliad, #rois.hide-scholia .roi.scholia, #rois.hide-other .roi.other { display: none; }
  #rois.hide-all .roi { display: none; }
  .roi.target { fill-opacity: .3; stroke-width: 3px; display: inline !important; }
  #tip { position: absolute; z-index: 5; max-width: min(34rem, calc(100% - 1rem)); max-height: 60%; overflow: hidden;
         background: var(--panel); color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
         padding: .45rem .65rem; box-shadow: 0 4px 16px #0006; pointer-events: none; font-size: .9375rem; }
  #tip .item + .item { margin-top: .5rem; padding-top: .5rem; border-top: 1px solid var(--line); }
  #tip .what { font: .8125rem ui-monospace, monospace; color: var(--muted); }
  #tip .what b { font-weight: 700; color: var(--fg); }
  #tip .greek { font-family: "Gentium Plus", "Cardo", "Palatino Linotype", "Times New Roman", serif; font-size: 1.1rem; line-height: 1.5; }
  #tip .lemma { font-weight: 700; }
  #tip .none { color: var(--muted); font-style: italic; }

  #copied { position: absolute; right: .75rem; top: .6rem; z-index: 6; background: #1f6b3a; color: #fff; padding: .2rem .6rem;
         border-radius: 4px; font-size: .8125rem; pointer-events: none; max-width: calc(100% - 1.5rem); }
  #copied.bad { background: #a3201a; }
  .roi { cursor: pointer; }
</style>
</head>
<body>
<header>
  <h1>Images</h1>
  <span id="status" role="status">Loading the current HMT release…</span>
  <span class="appmeta"><a class="home" href="https://neelsmith.github.io/hmt-apps/">← HMT apps home</a><span class="version">Version 0.5.1</span><a class="docs" href="https://neelsmith.github.io/hmt-apps/docs/images/">Docs</a></span>
</header>

<div id="drop" hidden>
  <p id="problem"></p>
  <p>You can load a saved copy of the release instead (<code>hmt-current.cex</code>): drop it here or <input type="file" id="file" accept=".cex,.txt,text/plain">.</p>
</div>

<main id="table-view">
  <div id="controls">
    <label class="coll">Collection <select id="collection" disabled></select></label>
    <label>Find <input type="search" id="find" placeholder="part of a caption…" autocomplete="off" disabled></label>
    <label>Size <input type="range" id="cell-size" min="90" max="320" value="170" disabled></label>
    <span id="shown"></span>
  </div>
  <p id="intro">Choose a collection of images.</p>
  <p id="note" hidden></p>
  <div id="grid"></div>
  <p id="empty" hidden>No images match.</p>
</main>

<section id="viewer-view" hidden>
  <div id="viewer-bar">
    <button class="btn" id="back" title="Back to the light box (Esc)">← Images</button>
    <span class="group">
      <button class="btn" id="prev" title="Previous image ([)" aria-label="Previous image">‹</button>
      <button class="btn" id="next" title="Next image (])" aria-label="Next image">›</button>
    </span>
    <span id="viewer-title"></span>
    <span id="viewer-count"></span>
    <button class="btn" id="rights-toggle" aria-expanded="false" aria-controls="rights">Rights</button>
    <span class="group" id="layers" role="group" aria-label="Indexed text shown" hidden>
      <label><input type="checkbox" id="show-iliad" checked><span class="chip iliad"></span>Iliad</label>
      <label><input type="checkbox" id="show-scholia" checked><span class="chip scholia"></span>Scholia</label>
      <label><input type="checkbox" id="show-other" checked><span class="chip other"></span>Other</label>
    </span>
    <span class="group">
      <button class="btn" id="zoom-out" title="Zoom out (-)" aria-label="Zoom out">−</button>
      <button class="btn" id="zoom-in" title="Zoom in (+)" aria-label="Zoom in">+</button>
      <button class="btn" id="roi-select" title="Mark regions" disabled>Select</button>
      <button class="btn" id="fit" title="Fit image (0)">Fit</button>
    </span>
  </div>
  <div id="rights" hidden></div>
  <div id="viewer-wrap">
    <div id="viewer" aria-label="Image. Drag to pan, scroll or pinch to zoom, Shift-drag to mark a region. Hover over an indexed rectangle to read its text; click to copy it."></div>
    <div id="viewer-note"></div>
    <div id="viewer-error" role="alert" hidden></div>
    <div id="tip" hidden></div>
    <div id="copied" role="status" hidden></div>
  </div>
  <div id="roi-panel" hidden></div>
</section>

<script>
// @ts-check
/**
 * Parsing of an HMT data release (a single CEX text file).
 *
 * Design notes
 * - No imports and no dependencies, so this file runs unchanged in Node
 *   (tests) and in a browser, and can later be inlined into a single-file app
 *   by stripping the leading `export` keywords.
 * - Parsing never throws on irregular data.  Irregularities are collected as
 *   warnings: see `HmtRelease.validate()`.
 */

/** Block labels recognised in a release, in the order given in CLAUDE.md. */
const BLOCK_TYPES = [
  'cexversion', 'citelibrary', 'citecollections', 'citeproperties',
  'citedata', 'datamodels', 'ctscatalog', 'ctsdata', 'citerelationset',
];

/** Default location of the current release. */
const DEFAULT_RELEASE_URL =
  'https://raw.githubusercontent.com/homermultitext/hmt-archive/refs/heads/master/releases-cex/hmt-current.cex';

/** Block types whose repeated blocks each start with the same header line. */
const FIXED_HEADER_TYPES = new Set(['citecollections', 'citeproperties', 'datamodels', 'ctscatalog']);

// ---------------------------------------------------------------------------
// Step 1: split text into labelled blocks
// ---------------------------------------------------------------------------

/**
 * @typedef {Object} Block
 * @property {string} type       Label without the `#!` prefix.
 * @property {number} startLine  1-based line number of the header line.
 * @property {string[]} lines    Data lines: comments and blank lines removed.
 */

/**
 * Split CEX text into blocks.  Lines starting with `//` and empty lines are
 * dropped.  Everything between a `#!` header line and the next belongs to the
 * first.
 * @param {string} text
 * @returns {{blocks: Block[], warnings: string[]}}
 */
function splitBlocks(text) {
  /** @type {Block[]} */
  const blocks = [];
  /** @type {string[]} */
  const warnings = [];
  /** @type {Block | null} */
  let current = null;
  const lines = text.split(/\r?\n/);
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.startsWith('#!')) {
      const type = line.slice(2).trim();
      if (!BLOCK_TYPES.includes(type)) {
        warnings.push(`line ${i + 1}: unrecognized block type "${type}"`);
      }
      current = { type, startLine: i + 1, lines: [] };
      blocks.push(current);
      continue;
    }
    if (line.startsWith('//') || line.trim() === '') continue;
    if (current === null) {
      warnings.push(`line ${i + 1}: content before the first block header ignored`);
      continue;
    }
    current.lines.push(line);
  }
  return { blocks, warnings };
}

// ---------------------------------------------------------------------------
// URN helpers (CITE2 and CTS)
// ---------------------------------------------------------------------------

/** True for a collection-level CITE2 URN, e.g. `urn:cite2:hmt:e3pages.v1:`. */
function isCollectionUrn(urn) {
  return /^urn:cite2:[^:]+:[^:]+:$/.test(urn);
}

/** Collection-level URN for an object URN, or null if `urn` is not CITE2. */
function collectionOfObject(urn) {
  const m = /^(urn:cite2:[^:]+:[^:]+:)/.exec(urn);
  return m ? m[1] : null;
}

/**
 * Collection-level URN for a property-level URN, e.g.
 * `urn:cite2:citebl:burney86pages.v1.sequence:` gives
 * `urn:cite2:citebl:burney86pages.v1:`.  Null if not property-level.
 */
function collectionOfProperty(urn) {
  const m = /^(urn:cite2:[^:]+:[^:]+)\.[^.:]+:$/.exec(urn);
  return m ? m[1] + ':' : null;
}

/** Property-level URN for a property name in a collection. */
function propertyUrn(collectionUrn, name) {
  return collectionUrn.slice(0, -1) + '.' + name + ':';
}

/**
 * Work-component prefix of a CTS URN (`urn:cts:ns:group.work.version[.exemplar]:`),
 * which is version-level or exemplar-level depending on the URN.
 */
function ctsWorkOf(urn) {
  const m = /^(urn:cts:[^:]+:[^:]+:)/.exec(urn);
  return m ? m[1] : null;
}

/** Version-level CTS URN (`urn:cts:ns:group.work.version:`): drops any exemplar part. */
function ctsVersionOf(urn) {
  const m = /^(urn:cts:[^:]+:)([^:]+):/.exec(urn);
  return m ? m[1] + m[2].split('.').slice(0, 3).join('.') + ':' : null;
}

// ---------------------------------------------------------------------------
// Step 2: typed access
// ---------------------------------------------------------------------------

/**
 * Parse lines of delimited text into objects keyed by `fields`.  Rows with the
 * wrong number of values are still returned (padded or truncated); they are
 * reported through `warn` as one summary message per table.
 * @param {string[]} lines
 * @param {string[]} fields
 * @param {(msg: string) => void} warn
 * @param {string} label  used in warnings
 * @returns {Record<string, string>[]}
 */
function rowsToObjects(lines, fields, warn, label) {
  let ragged = 0;
  let firstBad = 0;
  const out = lines.map((line, i) => {
    const vals = line.split('|');
    if (vals.length !== fields.length) {
      if (!ragged) firstBad = i + 1;
      ragged++;
    }
    /** @type {Record<string, string>} */
    const obj = {};
    fields.forEach((f, j) => { obj[f] = vals[j] ?? ''; });
    return obj;
  });
  if (ragged) {
    warn(`${label}: ${ragged} of ${lines.length} rows do not have ${fields.length} values (first: row ${firstBad})`);
  }
  return out;
}

class HmtRelease {
  /** @param {string} text  Full text of a CEX release. */
  constructor(text) {
    const { blocks, warnings } = splitBlocks(text);
    /** @type {Block[]} */
    this.blocks = blocks;
    /** @type {string[]} */
    this._warnings = [...warnings];
    /** @type {Map<string, any>} */
    this._cache = new Map();
  }

  /** @param {string} msg */
  _warn(msg) { if (!this._warnings.includes(msg)) this._warnings.push(msg); }

  /**
   * @template T
   * @param {string} key
   * @param {() => T} compute
   * @returns {T}
   */
  _memo(key, compute) {
    if (!this._cache.has(key)) this._cache.set(key, compute());
    return this._cache.get(key);
  }

  /** Block types actually present, in order of first appearance. */
  blockTypes() {
    return [...new Set(this.blocks.map(b => b.type))];
  }

  /**
   * Data lines of all blocks of one type, composited into a single array.
   * For types with one fixed header line (citecollections, citeproperties,
   * datamodels, ctscatalog) the first line of each repeated block is treated
   * as its header and dropped, so the result has a single header line at the
   * start.  For `citedata` and
   * `citerelationset` the composite is a plain concatenation; use `citeData()`
   * or `relationSets()` to get the per-block structure.
   * @param {string} type
   * @returns {string[]}
   */
  getBlock(type) {
    return this._memo('block:' + type, () => {
      const same = this.blocks.filter(b => b.type === type);
      if (!FIXED_HEADER_TYPES.has(type)) return same.flatMap(b => b.lines);
      /** @type {string[]} */
      const out = [];
      for (const b of same) {
        if (out.length === 0) { out.push(...b.lines); continue; }
        // Later blocks repeat the header line; drop it.
        if (b.lines[0] !== out[0]) {
          this._warn(`${type} (line ${b.startLine}): header "${b.lines[0]}" differs from first header "${out[0]}"`);
        }
        out.push(...b.lines.slice(1));
      }
      return out;
    });
  }

  /** The CEX version string, or null if absent. */
  get cexVersion() {
    const lines = this.getBlock('cexversion');
    if (this.blocks.filter(b => b.type === 'cexversion').length > 1) {
      this._warn('more than one #!cexversion block');
    }
    return lines.length ? lines[0].trim() : null;
  }

  /**
   * Library metadata from the `#!citelibrary` block.
   * @returns {{name: string, urn: string, license: string,
   *            namespaces: {abbreviation: string, uri: string}[]}}
   */
  get library() {
    return this._memo('library', () => {
      if (this.blocks.filter(b => b.type === 'citelibrary').length > 1) {
        this._warn('more than one #!citelibrary block');
      }
      const lib = { name: '', urn: '', license: '', namespaces: /** @type {{abbreviation: string, uri: string}[]} */ ([]) };
      for (const line of this.getBlock('citelibrary')) {
        const [key, ...rest] = line.split('|');
        if (key === 'namespace') {
          if (rest.length !== 2) this._warn(`citelibrary: malformed namespace line "${line}"`);
          lib.namespaces.push({ abbreviation: rest[0] ?? '', uri: rest[1] ?? '' });
        } else if (key === 'name' || key === 'urn' || key === 'license') {
          lib[key] = rest.join('|');
        } else {
          this._warn(`citelibrary: unrecognized key "${key}"`);
        }
      }
      return lib;
    });
  }

  /** @returns {{urn: string, description: string, labellingProperty: string, orderingProperty: string, license: string}[]} */
  collections() {
    return this._memo('collections', () => {
      const [, ...rows] = this.getBlock('citecollections');
      return /** @type {any} */ (rowsToObjects(rows,
        ['urn', 'description', 'labellingProperty', 'orderingProperty', 'license'],
        m => this._warn(m), 'citecollections'));
    });
  }

  /** @returns {{urn: string, label: string, type: string, authorityList: string}[]} */
  properties() {
    return this._memo('properties', () => {
      const [, ...rows] = this.getBlock('citeproperties');
      return /** @type {any} */ (rowsToObjects(rows,
        ['urn', 'label', 'type', 'authorityList'], m => this._warn(m), 'citeproperties'));
    });
  }

  /** @returns {{collection: string, model: string, label: string, description: string}[]} */
  dataModels() {
    return this._memo('datamodels', () => {
      const [, ...rows] = this.getBlock('datamodels');
      return /** @type {any} */ (rowsToObjects(rows,
        ['collection', 'model', 'label', 'description'], m => this._warn(m), 'datamodels'));
    });
  }

  /** @returns {Record<string, string>[]}  Keys: urn, citationScheme, groupName, workTitle, versionLabel, exemplarLabel, online, language. */
  ctsCatalog() {
    return this._memo('ctscatalog', () => {
      const [, ...rows] = this.getBlock('ctscatalog');
      return rowsToObjects(rows,
        ['urn', 'citationScheme', 'groupName', 'workTitle', 'versionLabel', 'exemplarLabel', 'online', 'language'],
        m => this._warn(m), 'ctscatalog');
    });
  }

  /**
   * Passages of all `#!ctsdata` blocks.  Each line is split at its first `|`.
   * @returns {{urn: string, text: string}[]}
   */
  ctsData() {
    return this._memo('ctsdata', () => {
      /** @type {{urn: string, text: string}[]} */
      const out = [];
      for (const line of this.getBlock('ctsdata')) {
        const i = line.indexOf('|');
        if (i < 0) { this._warn(`ctsdata: line without "|": "${line.slice(0, 60)}"`); continue; }
        if (line.indexOf('|', i + 1) >= 0) this._warn(`ctsdata: extra "|" in passage ${line.slice(0, i)}`);
        out.push({ urn: line.slice(0, i), text: line.slice(i + 1) });
      }
      return out;
    });
  }

  /**
   * Tables of all `#!citedata` blocks.  Each block has its own header.
   * `collections` lists the distinct collection URNs of the rows' `urn` values.
   * @returns {{header: string[], rows: Record<string, string>[], collections: string[], startLine: number}[]}
   */
  citeData() {
    return this._memo('citedata', () => this.blocks.filter(b => b.type === 'citedata').map(b => {
      const header = (b.lines[0] ?? '').split('|');
      const rows = rowsToObjects(b.lines.slice(1), header, m => this._warn(m), `citedata (line ${b.startLine})`);
      const cols = new Set();
      const urnField = header.find(h => h.toLowerCase() === 'urn');
      if (urnField !== undefined) {
        for (const r of rows) {
          const c = collectionOfObject(r[urnField]);
          if (c) cols.add(c);
        }
      } else if (b.lines.length) {
        this._warn(`citedata (line ${b.startLine}): no "urn" column, collection unknown`);
      }
      return { header, rows, collections: [...cols], startLine: b.startLine };
    }));
  }

  /**
   * Relation sets, one per `#!citerelationset` block: `urn` and `label`
   * key-value lines, then a header line, then rows.
   * @returns {{urn: string, label: string, header: string[], rows: Record<string, string>[], startLine: number}[]}
   */
  relationSets() {
    return this._memo('relationsets', () => this.blocks.filter(b => b.type === 'citerelationset').map(b => {
      let urn = '', label = '';
      let i = 0;
      for (; i < b.lines.length; i++) {
        const [key, ...rest] = b.lines[i].split('|');
        if (key === 'urn' && rest.length === 1 && !urn) urn = rest[0];
        else if (key === 'label' && !label) label = rest.join('|');
        else break;
      }
      if (!urn) this._warn(`citerelationset (line ${b.startLine}): no urn`);
      const header = (b.lines[i] ?? '').split('|');
      const rows = rowsToObjects(b.lines.slice(i + 1), header, m => this._warn(m), `citerelationset ${urn || b.startLine}`);
      return { urn, label, header, rows, startLine: b.startLine };
    }));
  }

  /**
   * Check the release for consistency.  Never throws; returns warnings
   * (including any irregularities noticed while parsing), empty if none.
   * @returns {string[]}
   */
  validate() {
    // Run every typed parser so their warnings are collected.
    this.cexVersion; this.library; this.ctsData();
    const collections = this.collections();
    const properties = this.properties();
    const models = this.dataModels();
    const catalog = this.ctsCatalog();
    const citeData = this.citeData();
    const relSets = this.relationSets();
    const warn = (/** @type {string} */ m) => this._warn(m);

    const collUrns = new Set(collections.map(c => c.urn));
    const propUrns = new Set(properties.map(p => p.urn));
    const propLower = new Set(properties.map(p => p.urn.toLowerCase()));

    for (const c of collections) {
      if (!isCollectionUrn(c.urn)) warn(`citecollections: "${c.urn}" is not a collection-level CITE2 URN`);
      if (!propUrns.has(c.labellingProperty)) {
        warn(`citecollections: labelling property "${c.labellingProperty}" of ${c.urn} is not documented in citeproperties`);
      }
      if (c.orderingProperty && !propUrns.has(c.orderingProperty)) {
        warn(`citecollections: ordering property "${c.orderingProperty}" of ${c.urn} is not documented in citeproperties`);
      }
    }
    for (const p of properties) {
      const c = collectionOfProperty(p.urn);
      if (!c) warn(`citeproperties: "${p.urn}" is not a property-level CITE2 URN`);
      else if (!collUrns.has(c)) warn(`citeproperties: collection ${c} of property ${p.urn} is not documented in citecollections`);
    }
    for (const t of citeData) {
      for (const c of t.collections) {
        if (!collUrns.has(c)) warn(`citedata (line ${t.startLine}): collection ${c} is not documented in citecollections`);
        const undocumented = t.header.filter(name => !propUrns.has(propertyUrn(c, name)))
          .map(name => propLower.has(propertyUrn(c, name).toLowerCase()) ? `${name} (documented with different capitalization)` : name);
        if (undocumented.length) {
          warn(`citedata (line ${t.startLine}): ${undocumented.length} of ${t.header.length} properties of ${c} not documented in citeproperties: ${undocumented.join(', ')}`);
        }
      }
    }
    for (const m of models) {
      if (!collUrns.has(m.collection) && !relSets.some(r => r.urn === m.collection)) {
        warn(`datamodels: ${m.collection} is neither a documented collection nor a relation set`);
      }
    }
    const modelled = new Set(models.map(m => m.collection));
    for (const r of relSets) {
      if (r.urn && !modelled.has(r.urn)) warn(`citerelationset: ${r.urn} has no entry in datamodels`);
    }
    const versions = new Set(catalog.map(c => c.urn));
    const missing = new Set();
    for (const p of this.ctsData()) {
      const w = ctsWorkOf(p.urn);
      const v = ctsVersionOf(p.urn);
      if (!(w && versions.has(w)) && !(v && versions.has(v))) missing.add(w ?? p.urn);
    }
    for (const v of missing) warn(`ctsdata: no ctscatalog entry for version ${v}`);

    return [...this._warnings];
  }
}

// ---------------------------------------------------------------------------
// Loading
// ---------------------------------------------------------------------------

/** Parse release text. */
function parseRelease(text) {
  return new HmtRelease(text);
}

/**
 * Fetch and parse a release.  Works when the page is served over http(s);
 * browsers block fetch from file:// pages, where apps should instead use
 * `readReleaseFile` with a file picker or drop target.
 * @param {string} [url]
 */
async function fetchRelease(url = DEFAULT_RELEASE_URL) {
  const resp = await fetch(url);
  if (!resp.ok) throw new Error(`Could not load ${url}: HTTP ${resp.status}`);
  return parseRelease(await resp.text());
}

/** Parse a release from a `File`/`Blob` (file picker or drag-and-drop). */
async function readReleaseFile(file) {
  return parseRelease(await file.text());
}

<script>
// @ts-check
/**
 * Shared lookup of CTS passage text in a release.  Used by several apps.
 * Convention for inlining (see scripts/build.js): imports are single-line.
 */

/**
 * Passages of one text (a version or exemplar), in the order of the release.
 * @typedef {Object} TextIndex
 * @property {string} urn                     Work-component URN, ending in ":".
 * @property {string[]} refs                  Passage references, in order.
 * @property {string[]} texts                 Passage text, parallel to `refs`.
 * @property {Map<string, number>} pos        Reference -> position in `refs`.
 */

/** Preferred order of exemplar kinds when listing the texts of a version. */
const KIND_ORDER = ['normalized', 'diplomatic'];

/** Name of the exemplar in a work-component URN ("normalized"), or "edition" for a version. */
function exemplarName(workUrn) {
  const parts = workUrn.split(':')[3].split('.');
  return parts.length > 3 ? parts.slice(3).join('.') : 'edition';
}

/**
 * Index every text in the release by work-component URN.  The order of
 * passages in the release is the order of the text (references like
 * `1.title` or `6.386del` do not sort numerically).
 * @param {import('./hmt-release.js').HmtRelease} release
 * @returns {Map<string, TextIndex>}
 */
function buildTextIndex(release) {
  /** @type {Map<string, TextIndex>} */
  const map = new Map();
  for (const { urn, text } of release.ctsData()) {
    const m = /^(urn:cts:[^:]+:[^:]+:)(.*)$/.exec(urn);
    if (!m) continue;
    let t = map.get(m[1]);
    if (!t) { t = { urn: m[1], refs: [], texts: [], pos: new Map() }; map.set(m[1], t); }
    if (!t.pos.has(m[2])) t.pos.set(m[2], t.refs.length);
    t.refs.push(m[2]);
    t.texts.push(text);
  }
  return map;
}

/** @type {WeakMap<Map<string, TextIndex>, Map<string, {urn: string, kind: string}[]>>} */
const versionTexts = new WeakMap();

/**
 * The texts (exemplars, or the version itself) available for a version URN,
 * `normalized` first.
 * @param {Map<string, TextIndex>} textIndex
 * @param {string} versionUrn  e.g. `urn:cts:greekLit:tlg0012.tlg001.msA:`
 * @returns {{urn: string, kind: string}[]}
 */
function textsOfVersion(textIndex, versionUrn) {
  let byVersion = versionTexts.get(textIndex);
  if (!byVersion) {
    byVersion = new Map();
    for (const key of textIndex.keys()) {
      const v = ctsVersionOf(key);
      if (!v) continue;
      const list = byVersion.get(v) ?? [];
      list.push({ urn: key, kind: exemplarName(key) });
      byVersion.set(v, list);
    }
    const rank = (/** @type {string} */ k) => KIND_ORDER.indexOf(k) + 1 || 99;
    for (const list of byVersion.values()) list.sort((a, b) => rank(a.kind) - rank(b.kind));
    versionTexts.set(textIndex, byVersion);
  }
  return byVersion.get(versionUrn) ?? [];
}

/**
 * Text of a passage, from the exemplar of the requested kind when the version
 * has one (otherwise the first available).  A passage with its own text gives
 * one part with an empty `part` name; a scholion, whose text is stored as
 * `<ref>.lemma` and `<ref>.comment`, gives those parts.  Nothing found gives
 * no parts.
 * @param {Map<string, TextIndex>} textIndex
 * @param {string} urn   Passage URN at version level, e.g. `urn:cts:greekLit:tlg0012.tlg001.msA:1.1`.
 * @param {string} kind  `diplomatic` or `normalized`.
 * @returns {{parts: {part: string, text: string}[]}}
 */
function passageText(textIndex, urn, kind) {
  const m = /^(urn:cts:[^:]+:[^:]+:)(.*)$/.exec(urn);
  if (!m) return { parts: [] };
  const version = ctsVersionOf(m[1]);
  const texts = version ? textsOfVersion(textIndex, version) : [];
  const pick = texts.find(t => t.kind === kind) ?? texts[0];
  const t = pick ? textIndex.get(pick.urn) : undefined;
  if (!t) return { parts: [] };
  const direct = t.pos.get(m[2]);
  if (direct !== undefined) return { parts: [{ part: '', text: t.texts[direct] }] };
  /** @type {{part: string, text: string}[]} */
  const parts = [];
  for (const part of ['lemma', 'comment']) {
    const i = t.pos.get(m[2] + '.' + part);
    if (i !== undefined) parts.push({ part, text: t.texts[i] });
  }
  return { parts };
}

<script>
// @ts-check
/**
 * Digital scholarly edition (DSE) index: the relation set that links text
 * passages to regions of interest (ROI) on manuscript images.
 * No DOM access.
 */

/** Relation set linking passages, image regions, and manuscript surfaces. */
const DSE_URN = 'urn:cite2:hmt:hmtdse.v1:all';

/**
 * @typedef {Object} Roi
 * @property {number} x  Left edge, as a fraction (0–1) of the image width.
 * @property {number} y  Top edge, as a fraction of the image height.
 * @property {number} w  Width, as a fraction of the image width.
 * @property {number} h  Height, as a fraction of the image height.
 */

/**
 * Parse `x,y,w,h` (fractions of the image size).  Whitespace around values
 * is tolerated.  Returns null if there are not four numbers, or the region is
 * empty or lies outside the image.  A region that sticks out past the right or
 * bottom edge by up to 0.02 of the image size (rounding in the source data,
 * e.g. x+w = 1.004) is clipped to the image.
 * @param {string} text
 * @returns {Roi | null}
 */
function parseRoi(text) {
  const parts = text.split(',').map(s => s.trim());
  if (parts.length !== 4 || parts.some(p => !/^[+-]?(\d+\.?\d*|\.\d+)$/.test(p))) return null;
  const [x, y, w, h] = parts.map(Number);
  const eps = 0.02;
  if (x < 0 || y < 0 || !(w > 0) || !(h > 0) || x + w > 1 + eps || y + h > 1 + eps) return null;
  return { x, y, w: Math.min(w, 1 - x), h: Math.min(h, 1 - y) };
}

/**
 * Split an `imageroi` value such as
 * `urn:cite2:hmt:vaimg.2017a:VA012RN_0013@0.0611,0.2252,0.4675,0.0901`.
 * @param {string} value
 * @returns {{image: string, roi: Roi} | null}  Null if there is no usable region.
 */
function parseImageRoi(value) {
  const at = value.indexOf('@');
  if (at < 0) return null;
  const roi = parseRoi(value.slice(at + 1));
  const image = value.slice(0, at).trim();
  return roi && image ? { image, roi } : null;
}

/**
 * Regions of the DSE relation set, grouped by image.
 * @param {import('./hmt-release.js').HmtRelease} release
 * @returns {{byImage: Map<string, {passage: string, roi: Roi}[]>, byPassage: Map<string, string[]>, rows: number, skipped: number, found: boolean}}
 *   `byPassage` maps a passage key (see `dseKey`) to the images it is indexed
 *   to, in index order, without repeats.  `skipped` counts rows without a
 *   usable region; `found` is false if the release has no such relation set.
 */
function indexDse(release) {
  /** @type {Map<string, {passage: string, roi: Roi}[]>} */
  const byImage = new Map();
  /** @type {Map<string, string[]>} */
  const byPassage = new Map();
  const set = release.relationSets().find(r => r.urn === DSE_URN);
  if (!set) return { byImage, byPassage, rows: 0, skipped: 0, found: false };
  let skipped = 0;
  for (const row of set.rows) {
    const parsed = parseImageRoi(row.imageroi ?? '');
    if (!parsed || !row.passage) { skipped++; continue; }
    const list = byImage.get(parsed.image) ?? [];
    list.push({ passage: row.passage, roi: parsed.roi });
    byImage.set(parsed.image, list);
    const key = dseKey(row.passage);
    if (key) {
      const images = byPassage.get(key) ?? [];
      if (!images.includes(parsed.image)) images.push(parsed.image);
      byPassage.set(key, images);
    }
  }
  return { byImage, byPassage, rows: set.rows.length, skipped, found: true };
}

/** @typedef {'iliad' | 'scholia' | 'other'} PassageKind */

/**
 * Kind of text a passage belongs to: the Iliad (tlg0012.tlg001), scholia
 * (tlg5026), or anything else.
 * @param {string} urn
 * @returns {PassageKind}
 */
function passageKind(urn) {
  const m = /^urn:cts:[^:]+:([^:.]+)\.([^:.]+)/.exec(urn);
  if (!m) return 'other';
  if (m[1] === 'tlg0012' && m[2] === 'tlg001') return 'iliad';
  if (m[1] === 'tlg5026') return 'scholia';
  return 'other';

const SCHOLIA_ZONES = {
  msA: 'main', msAint: 'interior', msAext: 'exterior', msAextra: 'extra',
  msAil: 'interlinear', msAim: 'intermarginal', msAimLater: 'later intermarginal', msAmeta: 'meta',
};

/**
 * Short label for a passage: `Iliad 5.506`, `Scholion 1.28 (interior)`,
 * otherwise the work title from the CTS catalog when known.
 * @param {string} urn
 * @param {Map<string, string>} [titles]  Version URN -> work title, from the CTS catalog.
 */
function passageLabel(urn, titles) {
  const m = /^urn:cts:[^:]+:([^:]+):(.*)$/.exec(urn);
  if (!m) return urn;
  const kind = passageKind(urn);
  if (kind === 'iliad') return `Iliad ${m[2]}`;
  if (kind === 'scholia') {
    const zone = /** @type {Record<string, string>} */ (SCHOLIA_ZONES)[m[1].split('.')[1]];
    return `Scholion ${m[2]}${zone ? ` (${zone})` : ''}`;
  }
  const version = `urn:cts:${urn.split(':')[2]}:${m[1].split('.').slice(0, 3).join('.')}:`;

/**
 * Work titles by version URN, from the CTS catalog.
 * @param {import('./hmt-release.js').HmtRelease} release
 * @returns {Map<string, string>}
 */
function catalogTitles(release) {
  return new Map(release.ctsCatalog().map(c => [c.urn, c.workTitle]));
}

/**
 * Key for comparing a passage URN with the passages of the DSE: the
 * version-level URN with the reference appended, so an exemplar part
 * (`.diplomatic`, `.normalized`) and a subreference (`@word`) are ignored, as
 * are the `.lemma` / `.comment` parts of a scholion.
 * `urn:cts:greekLit:tlg0012.tlg001.msA.normalized:1.1` gives
 * `urn:cts:greekLit:tlg0012.tlg001.msA:1.1`.
 * @param {string} urn
 * @returns {string | null}  Null if this is not a CTS passage URN.
 */
function dseKey(urn) {
  const m = /^(urn:cts:[^:]+:[^:]+:)(.+)$/.exec(urn.trim());
  if (!m) return null;
  const version = ctsVersionOf(m[1]);
  if (!version) return null;
  let ref = m[2].replace(/@.*$/, '');
  if (/^urn:cts:[^:]+:tlg5026\./.test(version)) ref = ref.replace(/\.(lemma|comment)$/, '');

}

/**
 * The DSE key (version URN + reference) of the passage a CTS URN names, or of the first of a range.
 * `urn:cts:greekLit:tlg0012.tlg001.msA.normalized:1.1-1.10` gives `urn:cts:greekLit:tlg0012.tlg001.msA:1.1`.
 * @param {string} textUrn
 * @returns {string | null}  Null if the URN has no passage.
 */
function firstPassageKey(textUrn) {
  const m = /^(urn:cts:[^:]+:[^:]+:)(.+)$/.exec((textUrn || '').trim());
  if (!m) return null;
  const first = m[2].split(/[-‐-―]/)[0].trim();
  return first ? dseKey(m[1] + first) : null;

 * only, so their location follows the server's convention:

 *
 * A view transform maps image pixels to screen (CSS) pixels:

const MAX_CACHED_TILES = 300;
const RETRY_MS = 10000;
const BASE_WIDTH = 1000;

/**
 * @typedef {Object} OpenOptions
 * @property {number} width    Image width in pixels.
 * @property {number} height   Image height in pixels.
 * @property {(region: string, size: string) => string} urlFor  Image URL for an IIIF region and size.
 * @property {string[]} [placeholders]  Small images (e.g. a thumbnail) to show until tiles load.
 */

class IiifViewer {
  /** @param {HTMLElement} root  Positioned element that will hold the viewer. */
  constructor(root) {
    this.root = root;
    root.classList.add('iiif-viewer');
    root.tabIndex = 0;
    root.style.touchAction = 'none';
    root.style.overflow = 'hidden';
    if (getComputedStyle(root).position === 'static') root.style.position = 'relative';

    this.canvas = document.createElement('canvas');
    this.canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;display:block';
    this.svg = /** @type {SVGSVGElement} */ (document.createElementNS(SVG_NS, 'svg'));
    this.svg.setAttribute('class', 'iiif-overlay');
    this.svg.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;overflow:hidden';
    /** Group for overlay shapes, in image pixel coordinates. */
    this.overlay = /** @type {SVGGElement} */ (document.createElementNS(SVG_NS, 'g'));
    this.svg.appendChild(this.overlay);
    /** Further groups in image pixel coordinates that follow the transform and are not cleared when an image is opened. @type {SVGGElement[]} */
    this.layers_ = [];
    root.append(this.canvas, this.svg);
    this.ctx = /** @type {CanvasRenderingContext2D} */ (this.canvas.getContext('2d'));

    /** @type {OpenOptions | null} */ this.image = null;
    this.t = { sc: 1, tx: 0, ty: 0 };
    this.minScale = 0.01;
    this.gen = 0;
    /**
     * Called first for the pointer that starts a drag, when no other pointer is down; if it returns true the viewer
     * does not pan.  For tools that draw on the image (see roi-tool.js).
     * @type {((e: PointerEvent) => boolean) | null}
     */
    this.interceptPointer = null;
    /** Called with the transform whenever the view changes.  @type {((t: {sc: number, tx: number, ty: number}) => void) | null} */
    this.onViewChange = null;
    /** True while the pointer is being dragged to pan; hover handlers should ignore events then. */
    this.dragging = false;
    /** @type {Map<number, {x: number, y: number}>} */ this.pointers = new Map();
    this.pinchDist = 0;
    this.downAt = { x: 0, y: 0 };
    this.moved = false;
    /** @type {HTMLImageElement[]} */ this.layers = [];
    /** @type {Map<string, {img: HTMLImageElement, state: string, at: number}>} */ this.tiles = new Map();
    /** @type {{key: string, tile: any}[]} */ this.wanted = [];
    this.inflight = 0;
    this.raf = 0;
    this.size = { w: 0, h: 0, dpr: 1 };

    this.ro = new ResizeObserver(() => this.onResize());
    this.ro.observe(root);
    this.bind();
  }

  /**
   * A group for shapes in image pixel coordinates, above the overlay; it follows the transform and is left alone when
   * an image is opened or closed.
   * @returns {SVGGElement}
   */
  addLayer() {
    const g = /** @type {SVGGElement} */ (document.createElementNS(SVG_NS, 'g'));
    g.setAttribute('transform', `translate(${this.t.tx} ${this.t.ty}) scale(${this.t.sc})`);
    this.svg.appendChild(g);
    this.layers_.push(g);
    return g;
  }

  /** Show an image, fitted to the view. */
  open(/** @type {OpenOptions} */ image) {
    this.gen++;
    this.image = image;
    this.tiles.clear();
    this.wanted = [];
    this.inflight = 0;
    this.layers = [];
    this.overlay.textContent = '';
    for (const url of [...(image.placeholders ?? []), image.urlFor('full', `${BASE_WIDTH},`)]) {
      const gen = this.gen;
      const img = new Image();
      img.decoding = 'async';
      img.onload = () => { if (gen === this.gen) { this.layers.push(img); this.schedule(); } };
      img.src = url;
    }
    this.measure();
    this.fit();
  }

  /** Stop showing the image and drop pending work. */
  close() {
    this.gen++;
    this.image = null;
    this.tiles.clear();
    this.wanted = [];
    this.layers = [];
    this.overlay.textContent = '';
    this.draw();
  }

  /** Fit the whole image in the view. */
  fit() {
    if (!this.image) return;
    const { w, h } = this.measure();
    const t = fitTransform(w, h, this.image.width, this.image.height);
    this.minScale = t.sc;
    this.set(t);
  }

  /** Zoom by a factor around the view centre (or a given screen point). */
  zoomBy(/** @type {number} */ factor, /** @type {number} */ px = this.size.w / 2, /** @type {number} */ py = this.size.h / 2) {
    this.set(zoomAt(this.t, factor, px, py, this.minScale, MAX_SCALE));
  }

  /** Pan by screen pixels. */
  panBy(/** @type {number} */ dx, /** @type {number} */ dy) {
    this.set({ sc: this.t.sc, tx: this.t.tx + dx, ty: this.t.ty + dy });
  }

  /** Screen point (relative to the viewer) of an image point. */
  toScreen(/** @type {number} */ x, /** @type {number} */ y) {
    return imageToScreen(this.t, x, y);
  }

  destroy() {
    this.ro.disconnect();
    cancelAnimationFrame(this.raf);
    this.root.textContent = '';
  }

  // --- internals -----------------------------------------------------------

  measure() {
    const r = this.root.getBoundingClientRect();
    this.size.w = r.width;
    this.size.h = r.height;
    this.size.dpr = window.devicePixelRatio || 1;
    return this.size;
  }

  onResize() {
    const before = { w: this.size.w, h: this.size.h };
    this.measure();
    if (!this.image) return;
    const atFit = Math.abs(this.t.sc - this.minScale) < 1e-9;
    const fitNow = fitTransform(this.size.w, this.size.h, this.image.width, this.image.height);
    this.minScale = fitNow.sc;
    if (atFit || before.w === 0) this.set(fitNow);
    else this.set(this.t);
  }

  set(/** @type {{sc: number, tx: number, ty: number}} */ t) {
    if (!this.image) { this.t = t; return; }
    this.t = clampTransform(t, this.size.w, this.size.h, this.image.width, this.image.height, this.minScale, MAX_SCALE);
    const tf = `translate(${this.t.tx} ${this.t.ty}) scale(${this.t.sc})`;
    this.overlay.setAttribute('transform', tf);
    for (const g of this.layers_) g.setAttribute('transform', tf);
    if (this.onViewChange) this.onViewChange(this.t);
    this.schedule();
  }

  schedule() {
    if (!this.raf) this.raf = requestAnimationFrame(() => { this.raf = 0; this.draw(); });
  }

  draw() {
    const { w, h, dpr } = this.size;
    const cw = Math.round(w * dpr), ch = Math.round(h * dpr);
    if (this.canvas.width !== cw || this.canvas.height !== ch) { this.canvas.width = cw; this.canvas.height = ch; }
    const ctx = this.ctx;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    if (!this.image) return;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const { sc, tx, ty } = this.t;
    const { width: W, height: H } = this.image;

    for (const img of this.layers) ctx.drawImage(img, tx, ty, W * sc, H * sc);

    const level = chooseLevel(sc, dpr, maxLevel(W, H));
    const tiles = visibleTiles(this.t, w, h, W, H, level);
    /** @type {{key: string, tile: any}[]} */
    const wanted = [];
    const now = Date.now();
    for (const tile of tiles) {
      const key = `${tile.level}/${tile.i}/${tile.j}`;
      const entry = this.tiles.get(key);
      if (entry && entry.state === 'loaded') {
        ctx.drawImage(entry.img, tx + tile.x * sc, ty + tile.y * sc, tile.w * sc, tile.h * sc);
        this.tiles.delete(key); this.tiles.set(key, entry);      // mark recently used
      } else if (!entry || (entry.state === 'error' && now - entry.at > RETRY_MS)) {
        wanted.push({ key, tile });
      }
    }
    const cx = (w / 2 - tx) / sc, cy = (h / 2 - ty) / sc;
    wanted.sort((a, b) =>
      Math.hypot(a.tile.x + a.tile.w / 2 - cx, a.tile.y + a.tile.h / 2 - cy) -
      Math.hypot(b.tile.x + b.tile.w / 2 - cx, b.tile.y + b.tile.h / 2 - cy));
    this.wanted = wanted;
    this.pump();
  }

  pump() {
    const image = this.image;
    if (!image) return;
    while (this.inflight < MAX_INFLIGHT && this.wanted.length) {
      const next = this.wanted.shift();
      if (!next) break;
      const { key, tile } = next;
      if (this.tiles.get(key)?.state === 'loading') continue;
      const img = new Image();
      const entry = { img, state: 'loading', at: Date.now() };
      this.tiles.set(key, entry);
      const gen = this.gen;
      this.inflight++;
      const done = (/** @type {string} */ state) => {
        if (gen !== this.gen) return;
        this.inflight--;
        entry.state = state; entry.at = Date.now();
        this.evict();
        this.schedule();
      };
      img.onload = () => done('loaded');
      img.onerror = () => done('error');
      img.decoding = 'async';
      img.src = image.urlFor(`${tile.x},${tile.y},${tile.w},${tile.h}`, `${tile.outW},`);
    }
  }

  evict() {
    if (this.tiles.size <= MAX_CACHED_TILES) return;
    for (const [key, entry] of this.tiles) {
      if (this.tiles.size <= MAX_CACHED_TILES) break;
      if (entry.state !== 'loading') this.tiles.delete(key);
    }
  }

  bind() {
    const root = this.root;
    const local = (/** @type {MouseEvent} */ e) => {
      const r = root.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    };

    root.addEventListener('pointerdown', e => {
      if (e.button !== 0 && e.pointerType === 'mouse') return;
      if (this.image && this.pointers.size === 0 && this.interceptPointer && this.interceptPointer(e)) return;
      root.setPointerCapture(e.pointerId);
      const p = local(e);
      this.pointers.set(e.pointerId, p);
      if (this.pointers.size === 1) { this.downAt = p; this.moved = false; }
      if (this.pointers.size === 2) {
        const [a, b] = [...this.pointers.values()];
        this.pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
        this.moved = true;
      }
    });

    root.addEventListener('pointermove', e => {
      const prev = this.pointers.get(e.pointerId);
      if (!prev) return;
      const p = local(e);
      this.pointers.set(e.pointerId, p);
      if (this.pointers.size === 1) {
        if (!this.moved && Math.hypot(p.x - this.downAt.x, p.y - this.downAt.y) < 4) return;
        this.moved = true;
        this.dragging = true;
        root.classList.add('dragging');
        this.panBy(p.x - prev.x, p.y - prev.y);
      } else if (this.pointers.size === 2) {
        const [a, b] = [...this.pointers.values()];
        const dist = Math.hypot(a.x - b.x, a.y - b.y);
        if (this.pinchDist > 0) this.zoomBy(dist / this.pinchDist, (a.x + b.x) / 2, (a.y + b.y) / 2);
        this.pinchDist = dist;
        this.dragging = true;
      }
    });

    const up = (/** @type {PointerEvent} */ e) => {
      if (!this.pointers.delete(e.pointerId)) return;
      if (this.pointers.size === 0) {
        // Clear after the click that ends a drag has been dispatched.
        setTimeout(() => { this.dragging = false; root.classList.remove('dragging'); }, 0);
      }
      this.pinchDist = 0;
    };
    root.addEventListener('pointerup', up);
    root.addEventListener('pointercancel', up);

    root.addEventListener('wheel', e => {
      e.preventDefault();
      const p = local(e);
      this.zoomBy(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), p.x, p.y);
    }, { passive: false });

    root.addEventListener('dblclick', e => {
      const p = local(e);
      this.zoomBy(e.shiftKey ? 0.5 : 2, p.x, p.y);
    });

    root.addEventListener('keydown', e => {
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const step = 80;
      const handled = {
        '+': () => this.zoomBy(1.4), '=': () => this.zoomBy(1.4), '-': () => this.zoomBy(1 / 1.4), '_': () => this.zoomBy(1 / 1.4),
        '0': () => this.fit(),
        ArrowLeft: () => this.panBy(step, 0), ArrowRight: () => this.panBy(-step, 0),
        ArrowUp: () => this.panBy(0, step), ArrowDown: () => this.panBy(0, -step),
      }[e.key];
      if (handled) { e.preventDefault(); handled(); }
    });
  }
}

<script>
// @ts-check
/**
 * Regions of interest on an image: rectangles kept as fractions of the whole image (0 to 1), so that they mean the
 * same part of the image at any size or zoom, and written as an extension of the image's CITE2 URN,
 * `urn:cite2:hmt:vaimg.2017a:VA051RN_0052@0.2140,0.5184,0.1710,0.0225` (`@x,y,w,h`).  Pure; the drawing and
 * the list of regions are in roi-tool.js and roi-panel.js.  Parsing a written region is `parseRoi` in dse.js.
 */

/** @typedef {{x: number, y: number, w: number, h: number}} Roi  Fractions of the image width and height. */
/** @typedef {{sc: number, tx: number, ty: number}} ViewTransform  Screen = image pixel * sc + (tx, ty); see pan-zoom.js. */
/** @typedef {'nw' | 'ne' | 'sw' | 'se'} Handle */

/** Smallest region kept, as a fraction of the width or height; smaller drags are ignored (they were clicks). */
const MIN_ROI = 0.002;

/** @param {number} v */
const clamp01 = v => Math.min(1, Math.max(0, v));

/**
 * The point of the image, as fractions, under a point of the screen (relative to the viewer); clamped to the image.
 * @param {ViewTransform} t
 * @param {number} imgW
 * @param {number} imgH
 * @param {number} sx
 * @param {number} sy
 * @returns {{fx: number, fy: number}}
 */
function fractionAt(t, imgW, imgH, sx, sy) {
  return { fx: clamp01((sx - t.tx) / t.sc / imgW), fy: clamp01((sy - t.ty) / t.sc / imgH) };
}

/**
 * The rectangle between two corners, given in either order.
 * @param {{fx: number, fy: number}} a
 * @param {{fx: number, fy: number}} b
 * @returns {Roi | null}  Null if it is too small to be a region.
 */
function roiFromCorners(a, b) {
  const x = Math.min(a.fx, b.fx), y = Math.min(a.fy, b.fy);
  const w = Math.abs(a.fx - b.fx), h = Math.abs(a.fy - b.fy);
  return w < MIN_ROI || h < MIN_ROI ? null : { x, y, w, h };
}

/**
 * Move a region by fractions of the image, keeping it inside the image.
 * @param {Roi} r
 * @param {number} dx
 * @param {number} dy
 * @returns {Roi}
 */
function moveRoi(r, dx, dy) {
  return { ...r, x: Math.min(1 - r.w, Math.max(0, r.x + dx)), y: Math.min(1 - r.h, Math.max(0, r.y + dy)) };
}

/**
 * Drag one corner of a region to a point; the opposite corner stays where it is (and the region may be turned inside out).
 * @param {Roi} r
 * @param {Handle} handle
 * @param {number} fx
 * @param {number} fy
 * @returns {Roi}  The region unchanged if the result would be too small.
 */
function resizeRoi(r, handle, fx, fy) {
  const fixed = { fx: handle.includes('w') ? r.x + r.w : r.x, fy: handle.includes('n') ? r.y + r.h : r.y };
  return roiFromCorners(fixed, { fx: clamp01(fx), fy: clamp01(fy) }) ?? r;
}

/**
 * `x,y,w,h` with four decimals (under half a pixel on a 4000-pixel image).
 * @param {Roi} r
 */
function formatRoi(r) {
  return [r.x, r.y, r.w, r.h].map(v => v.toFixed(4)).join(',');
}

/**
 * The URN of a region: the image URN (without any region it already has) and `@x,y,w,h`.
 * @param {string} imageUrn
 * @param {Roi} r
 */
function roiUrn(imageUrn, r) {
  return `${imageUrn.split('@')[0]}@${formatRoi(r)}`;
}

/**
 * Two regions as written the same?
 * @param {Roi} a
 * @param {Roi} b
 */
function sameRoi(a, b) {
  return formatRoi(a) === formatRoi(b);
}

<script>
// @ts-check
/**
 * Drawing regions of interest on the image of an `IiifViewer` (image-viewer.js).  Shift-drag draws a rectangle at any
 * time; with Select on (a button for touch screens), a plain drag draws, a region can be dragged to move it or by its
 * corner handles to resize it, and clicking one makes it the current region.  Delete removes the current region;
 * Escape leaves Select.
 *
 * A region is kept as fractions of the whole image (roi.js) and redrawn whenever the view changes, so it always
 * bounds the same part of the image however it is panned or zoomed.  The rectangles are in a layer of the viewer
 * that follows its transform (`viewer.addLayer()`); labels and handles are redrawn at a fixed size on screen.
 */

const ROI_SVG_NS = 'http://www.w3.org/2000/svg';
const ROI_HANDLES = /** @type {const} */ (['nw', 'ne', 'sw', 'se']);
const ROI_HANDLE_PX = 11;

/**
 * @param {string} tag
 * @param {Record<string, string | number>} attrs
 */
function roiSvgEl(tag, attrs) {
  const e = document.createElementNS(ROI_SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, String(v));
  return e;
}

class RoiTool {
  /**
   * @param {import('./image-viewer.js').IiifViewer} viewer
   * @param {(rois: import('./roi.js').Roi[], current: number) => void} onChange  Called when the regions or the current one change.
   */
  constructor(viewer, onChange) {
    this.viewer = viewer;
    this.onChange = onChange;
    /** @type {import('./roi.js').Roi[]} */ this.rois = [];
    this.current = -1;
    this.selecting = false;
    this.shiftHeld = false;
    this.drawing = false;
    this.shiftDrawing = false;   // the drag in progress was started with Shift
    /** Called when Select is turned on or off.  @type {((on: boolean) => void) | null} */
    this.onSelecting = null;
    this.layer = viewer.addLayer();
    this.layer.classList.add('roi-layer');

    viewer.interceptPointer = e => this.pointerDown(e);
    const prev = viewer.onViewChange;
    viewer.onViewChange = t => { if (prev) prev(t); this.render(); };
    const root = viewer.root;
    root.addEventListener('keydown', e => { if (this.handleKey(e)) { e.preventDefault(); e.stopPropagation(); } });
    this.overViewer = false;
    root.addEventListener('pointerenter', e => { this.overViewer = true; this.setShift(e.shiftKey); this.updateCursor(); });
    root.addEventListener('pointerleave', () => { this.overViewer = false; this.updateCursor(); });
    root.addEventListener('pointermove', e => this.setShift(e.shiftKey));
    // Shift is noticed wherever the focus is, so the cursor is a crosshair as soon as Shift is down over the image
    window.addEventListener('keydown', e => { if (e.key === 'Shift') this.setShift(true); });
    window.addEventListener('keyup', e => { if (e.key === 'Shift') this.setShift(false); });
    window.addEventListener('blur', () => this.setShift(false));
  }

  /** A copy of the regions. */
  get list() { return this.rois.map(r => ({ ...r })); }

  /**
   * Replace all regions (on opening another image).
   * @param {import('./roi.js').Roi[]} rois
   * @param {boolean} [notify]
   */
  set(rois, notify = false) {
    this.rois = rois.map(r => ({ ...r }));
    this.current = this.rois.length ? this.rois.length - 1 : -1;
    this.render();
    if (notify) this.changed();
  }

  /** Add a region unless the same one is there; it becomes the current one. */
  add(/** @type {import('./roi.js').Roi} */ r) {
    const i = this.rois.findIndex(x => sameRoi(x, r));
    if (i >= 0) this.current = i;
    else { this.rois.push({ ...r }); this.current = this.rois.length - 1; }
    this.render();
    this.changed();
  }

  /** @param {boolean} on */
  setSelecting(on) {
    this.selecting = on;
    this.layer.classList.toggle('selecting', on);
    this.updateCursor();
    this.render();
    if (this.onSelecting) this.onSelecting(on);
  }

  /** @param {number} i */
  select(i) { this.current = i; this.render(); this.changed(); }

  /** @param {number} i */
  remove(i) {
    this.rois.splice(i, 1);
    this.current = Math.min(this.current, this.rois.length - 1);
    this.render();
    this.changed();
  }

  clear() { this.rois = []; this.current = -1; this.render(); this.changed(); }

  /**
   * Delete or Backspace removes the current region; Escape leaves Select.
   * @param {KeyboardEvent} e
   * @returns {boolean} True if the key was used.
   */
  handleKey(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return false;
    if ((e.key === 'Delete' || e.key === 'Backspace') && this.current >= 0) { this.remove(this.current); return true; }
    if (e.key === 'Escape' && this.selecting) { this.setSelecting(false); return true; }
    return false;
  }

  changed() { this.onChange(this.list, this.current); }

  /** @param {boolean} on */
  setShift(on) {
    if (on === this.shiftHeld) return;
    this.shiftHeld = on;
    this.updateCursor();
  }

  updateCursor() {
    const root = this.viewer.root;
    root.classList.toggle('roi-draw', this.shiftHeld || this.drawing || this.selecting);
    root.classList.toggle('roi-shift', (this.shiftHeld && this.overViewer) || this.shiftDrawing);
  }

  /** Draw the regions for the current view. */
  render() {
    const g = this.layer;
    g.textContent = '';
    const img = this.viewer.image;
    if (!img) return;
    const { sc } = this.viewer.t;
    const hs = ROI_HANDLE_PX / sc;
    this.rois.forEach((r, i) => {
      const x = r.x * img.width, y = r.y * img.height, w = r.w * img.width, h = r.h * img.height;
      const cur = i === this.current;
      const box = roiSvgEl('rect', { x, y, width: w, height: h, class: `user-roi${cur ? ' current' : ''}` });
      /** @type {SVGElement} */ (box).dataset.i = String(i);
      g.appendChild(box);
      const label = roiSvgEl('text', { x, y: y - 6 / sc, class: `user-roi-label${cur ? ' current' : ''}`, 'font-size': 15 / sc });
      label.textContent = String(i + 1);
      g.appendChild(label);
      if (this.selecting && cur) {
        for (const hd of ROI_HANDLES) {
          const hx = hd.includes('w') ? x : x + w, hy = hd.includes('n') ? y : y + h;
          const el = roiSvgEl('rect', { x: hx - hs / 2, y: hy - hs / 2, width: hs, height: hs, class: `user-roi-handle ${hd}` });
          /** @type {SVGElement} */ (el).dataset.handle = hd;
          /** @type {SVGElement} */ (el).dataset.i = String(i);
          g.appendChild(el);
        }
      }
    });
  }

  /** @param {{clientX: number, clientY: number}} e */
  fraction(e) {
    const img = /** @type {NonNullable<typeof this.viewer.image>} */ (this.viewer.image);
    const r = this.viewer.root.getBoundingClientRect();
    return fractionAt(this.viewer.t, img.width, img.height, e.clientX - r.left, e.clientY - r.top);
  }

  /**
   * Start of a drag in the viewer.
   * @param {PointerEvent} e
   * @returns {boolean} True if the tool takes the drag (the viewer then does not pan).
   */
  pointerDown(e) {
    if (!this.viewer.image || (e.pointerType === 'mouse' && e.button !== 0)) return false;
    const t = /** @type {Element} */ (e.target);
    const ds = /** @type {DOMStringMap} */ (t.closest ? (t.closest('[data-i]')?.dataset ?? {}) : {});
    const shift = e.shiftKey;
    const onHandle = !shift && this.selecting && !!ds.handle;
    const onBox = !shift && this.selecting && !onHandle && ds.i !== undefined && t.classList.contains('user-roi');
    if (!shift && !this.selecting) return false;
    e.preventDefault();
    e.stopPropagation();
    this.viewer.root.focus({ preventScroll: true });
    this.drawing = true;
    this.shiftDrawing = shift;
    this.updateCursor();
    const start = this.fraction(e);
    const i = Number(ds.i ?? -1);
    /** @type {(f: {fx: number, fy: number}) => void} */
    let op;
    if (onHandle) {
      const base = this.rois[i], h = /** @type {'nw'|'ne'|'sw'|'se'} */ (ds.handle);
      this.current = i;
      op = f => { this.rois[i] = resizeRoi(base, h, f.fx, f.fy); };
    } else if (onBox) {
      const base = this.rois[i];
      this.current = i;
      op = f => { this.rois[i] = moveRoi(base, f.fx - start.fx, f.fy - start.fy); };
    } else {
      let idx = -1;
      op = f => {
        const r = roiFromCorners(start, f);
        if (!r) return;
        if (idx < 0) { this.rois.push(r); idx = this.rois.length - 1; this.current = idx; }
        else this.rois[idx] = r;
      };
    }
    let moved = false;
    const move = (/** @type {PointerEvent} */ ev) => { moved = true; op(this.fraction(ev)); this.render(); };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
      window.removeEventListener('pointercancel', up);
      this.drawing = false;
      this.shiftDrawing = false;
      this.updateCursor();
      // like a pan: let the click that ends the drag pass before hover and click handlers act again
      this.viewer.dragging = true;
      setTimeout(() => { this.viewer.dragging = false; }, 0);
      if (!moved && (onBox || onHandle)) this.current = i;
      this.render();
      this.changed();
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
    window.addEventListener('pointercancel', up);
    this.render();
    return true;
  }
}

<script>
// @ts-check
/**
 * The regions of interest of the image in an `IiifViewer`: a Select button and a panel listing each region as a CITE2
 * URN with its `@x,y,w,h` extension, each with a Copy button.  Wraps the drawing tool (roi-tool.js).  Regions are kept
 * for each image while the page is open, so stepping away from an image and back finds them again.
 *
 * An app creates one `RoiUi` for its viewer, calls `open(imageUrn)` once the image is shown and `close()` when it is
 * not; `open` may be given regions to start with (e.g. from the address).
 */


/**
 * Copy text to the clipboard; resolves to whether it worked.
 * @param {string} text
 */
async function copyToClipboard(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) { /* fall through to the old way */ }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
  document.body.appendChild(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  ta.remove();
  return ok;
}

/**
 * @param {string} tag
 * @param {string} [cls]
 * @param {string} [text]
 */
function roiEl(tag, cls = '', text = '') {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text) e.textContent = text;
  return e;
}

class RoiUi {
  /**
   * @param {import('./image-viewer.js').IiifViewer} viewer
   * @param {{button: HTMLButtonElement, panel: HTMLElement}} els  The Select button, and the (empty) element for the list.
   */
  constructor(viewer, els) {
    this.button = els.button;
    this.panel = els.panel;
    this.urn = '';
    /** @type {Map<string, import('./roi.js').Roi[]>} */ this.byImage = new Map();
    this.tool = new RoiTool(viewer, () => this.changed());
    this.tool.onSelecting = on => {
      this.button.setAttribute('aria-pressed', String(on));
      this.button.classList.toggle('on', on);
      if (this.urn) this.show();   // the hint changes
    };
    this.button.type = 'button';
    this.button.setAttribute('aria-pressed', 'false');
    this.button.title = 'Mark regions of the image: drag to draw, or hold Shift and drag at any time';
    this.button.addEventListener('click', () => { if (this.urn) { this.tool.setSelecting(!this.tool.selecting); viewer.root.focus({ preventScroll: true }); } });
    this.close();
  }

  /**
   * Start working on an image.
   * @param {string} imageUrn  CITE2 URN of the image (a region on it is dropped from the URN).
   * @param {import('./roi.js').Roi[]} [start]  Regions to add to those already marked on this image.
   */
  open(imageUrn, start = []) {
    this.tool.setSelecting(false);
    this.urn = imageUrn.split('@')[0];
    this.button.disabled = false;
    this.tool.set(this.byImage.get(this.urn) ?? []);
    for (const r of start) this.tool.add(r);
    this.show();
  }

  /** The image is no longer shown. */
  close() {
    this.tool.setSelecting(false);
    this.urn = '';
    this.button.disabled = true;
    this.tool.set([]);
    this.panel.hidden = true;
    this.panel.textContent = '';
  }

  changed() {
    if (this.urn) this.byImage.set(this.urn, this.tool.list);
    this.show();
  }

  /** The URNs of the regions of the open image, in order. */
  get urns() { return this.tool.list.map(r => roiUrn(this.urn, r)); }

  show() {
    const p = this.panel;
    p.textContent = '';
    const rois = this.tool.list;
    p.hidden = !this.urn || rois.length === 0;
    if (p.hidden) return;
    const cur = this.tool.current;
    p.appendChild(roiEl('h2', 'roi-head', `Regions of interest (${rois.length})`));
    const ol = roiEl('ol', 'roi-list');
    rois.forEach((r, i) => {
      const urn = roiUrn(this.urn, r);
      const li = roiEl('li', i === cur ? 'current' : '');
      const num = /** @type {HTMLButtonElement} */ (roiEl('button', 'roi-num', String(i + 1)));
      num.type = 'button'; num.title = 'Make this the current region';
      num.addEventListener('click', () => this.tool.select(i));
      const code = roiEl('code', 'roi-urn', urn);
      code.title = `x,y,w,h = ${formatRoi(r)}, fractions of the image width and height`;
      const del = /** @type {HTMLButtonElement} */ (roiEl('button', 'roi-btn', '×'));
      del.type = 'button'; del.title = 'Remove this region'; del.setAttribute('aria-label', `Remove region ${i + 1}`);
      del.addEventListener('click', () => this.tool.remove(i));
      li.append(num, code, this.copyButton(urn, 'Copy this URN'), del);
      ol.appendChild(li);
    });
    p.appendChild(ol);
    const row = roiEl('div', 'roi-actions');
    if (rois.length > 1) row.appendChild(this.copyButton(this.urns.join('\n'), 'Copy every URN, one per line', 'Copy all'));
    const clear = /** @type {HTMLButtonElement} */ (roiEl('button', 'roi-btn', 'Clear all'));
    clear.type = 'button'; clear.title = 'Remove every region on this image';
    clear.addEventListener('click', () => this.tool.clear());
    row.appendChild(clear);
    p.appendChild(row);
    p.appendChild(roiEl('p', 'roi-hint', this.tool.selecting
      ? 'Select is on: drag a region to move it, drag a corner handle to resize it, click one to make it current; Delete removes it, Esc leaves Select.'
      : 'To move or resize a region, press Select, then drag it or its corner handles.'));
  }

  /**
   * @param {string} text
   * @param {string} title
   * @param {string} [label]
   */
  copyButton(text, title, label = 'Copy') {
    const b = /** @type {HTMLButtonElement} */ (roiEl('button', 'roi-btn roi-copy', label));
    b.type = 'button'; b.title = title;
    b.addEventListener('click', async () => {
      const ok = await copyToClipboard(text);
      b.textContent = ok ? 'Copied' : 'Copy failed';
      setTimeout(() => { b.textContent = label; }, 1800);
    });
    return b;
  }
}
