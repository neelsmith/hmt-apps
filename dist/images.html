<script>
// @ts-check
/**
 * The indexed text of an image, on an `IiifViewer`: a rectangle over each region the DSE records index to the open
 * image (coloured for the Iliad, scholia and other texts, and switched on and off by checkboxes), the diplomatic text of
 * the passage in a tooltip when the pointer is over it, and a click that copies the passage URN and its text.
 *
 * Needs the release's DSE index (`indexDse`), text index (`buildTextIndex`) and catalog titles (`catalogTitles`), the
 * viewer's overlay (`viewer.overlay`, in image pixel coordinates), and in the page a `#tip` and a `#copied` element
 * inside the viewer's wrapper (see text-regions.css).  The rectangles carry the passage as `data-passage`.
 */




const TR_NS = 'http://www.w3.org/2000/svg';
const TR_KINDS = /** @type {const} */ (['iliad', 'scholia', 'other']);
const TR_TIP_MAX_CHARS = 700;
const TR_TIP_MAX_ITEMS = 4;

class TextRegions {
  /**
   * @param {import('./image-viewer.js').IiifViewer} viewer
   * @param {{tip: HTMLElement, copied: HTMLElement, wrap: HTMLElement, checks: Record<'iliad' | 'scholia' | 'other', HTMLInputElement>, onShown?: (n: number) => void}} els
   */
  constructor(viewer, els) {
    this.viewer = viewer;
    this.els = els;
    /** @type {Map<string, {passage: string, roi: import('./dse.js').Roi}[]>} */ this.byImage = new Map();
    /** @type {Map<string, any>} */ this.textIndex = new Map();
    /** @type {Map<string, string>} */ this.titles = new Map();
    this.lastTipKey = '';
    this.toastTimer = 0;
    viewer.overlay.id = 'rois';
    for (const k of TR_KINDS) els.checks[k].addEventListener('change', () => this.applyLayers());
    this.bind();
  }

  /**
   * @param {{byImage: Map<string, {passage: string, roi: import('./dse.js').Roi}[]>, textIndex: Map<string, any>, titles: Map<string, string>}} data
   */
  setData(data) {
    this.byImage = data.byImage;
    this.textIndex = data.textIndex;
    this.titles = data.titles;
  }

  /** Number of indexed regions of an image. @param {string} imageUrn */
  count(imageUrn) { return (this.byImage.get(imageUrn) ?? []).length; }

  /**
   * Draw the regions of an image that is open in the viewer.
   * @param {string} imageUrn
   * @param {number} width   Image width in pixels.
   * @param {number} height
   * @param {string} [target]  DSE key of a passage whose regions are marked `target` and shown whatever the checkboxes say.
   * @returns {number} How many regions were drawn.
   */
  show(imageUrn, width, height, target = '') {
    const regions = this.byImage.get(imageUrn) ?? [];
    const overlay = this.viewer.overlay;
    overlay.textContent = '';
    const frag = document.createDocumentFragment();
    for (const r of regions) {
      const rect = document.createElementNS(TR_NS, 'rect');
      const p = roiToRect(r.roi, width, height);
      rect.setAttribute('x', String(p.x)); rect.setAttribute('y', String(p.y));
      rect.setAttribute('width', String(p.w)); rect.setAttribute('height', String(p.h));
      rect.setAttribute('class', `roi ${passageKind(r.passage)}${target && dseKey(r.passage) === target ? ' target' : ''}`);
      /** @type {SVGElement} */ (rect).dataset.passage = r.passage;
      frag.appendChild(rect);
    }
    overlay.appendChild(frag);
    this.applyLayers();
    if (this.els.onShown) this.els.onShown(regions.length);
    return regions.length;
  }

  /** The image is no longer shown. */
  clear() {
    this.viewer.overlay.textContent = '';
    this.hideTip();
    if (this.els.onShown) this.els.onShown(0);
  }

  applyLayers() {
    for (const k of TR_KINDS) this.viewer.overlay.classList.toggle(`hide-${k}`, !this.els.checks[k].checked);
    this.hideTip();
  }

  hideTip() {
    this.els.tip.hidden = true;
    this.lastTipKey = '';
    for (const el of this.viewer.overlay.querySelectorAll('.hot')) el.classList.remove('hot');
  }

  /** @param {string} passage */
  tipItem(passage) {
    const div = document.createElement('div');
    div.className = 'item';
    const what = document.createElement('div');
    what.className = 'what';
    const b = document.createElement('b');
    b.textContent = passageLabel(passage, this.titles);
    what.appendChild(b);
    div.appendChild(what);
    const body = document.createElement('div');
    body.className = 'greek'; body.lang = 'grc';
    const { parts } = passageText(this.textIndex, passage, 'diplomatic');
    if (!parts.length) {
      body.className = 'none';
      body.textContent = 'Text not available in this release.';
    } else {
      let remaining = TR_TIP_MAX_CHARS;
      for (const p of parts) {
        if (remaining <= 0) break;
        const text = p.text.length > remaining ? p.text.slice(0, remaining) + '…' : p.text;
        remaining -= text.length;
        const span = document.createElement('span');
        if (p.part === 'lemma') span.className = 'lemma';
        span.textContent = text;
        if (body.childNodes.length) body.append(' ');
        body.appendChild(span);
      }
    }
    div.appendChild(body);
    return div;
  }

  /** The indexed regions under a point of the screen, topmost first.  @param {number} x @param {number} y */
  regionsAt(x, y) {
    return /** @type {SVGElement[]} */ (document.elementsFromPoint(x, y).filter(el => el.classList && el.classList.contains('roi')));
  }

  /** @param {number} clientX @param {number} clientY */
  showTipAt(clientX, clientY) {
    const els = this.regionsAt(clientX, clientY);
    const tip = this.els.tip;
    if (!els.length) { this.hideTip(); return; }
    const key = els.map(el => el.dataset.passage).join('\n');
    if (key !== this.lastTipKey) {
      this.lastTipKey = key;
      for (const el of this.viewer.overlay.querySelectorAll('.hot')) el.classList.remove('hot');
      for (const el of els) el.classList.add('hot');
      tip.textContent = '';
      for (const el of els.slice(0, TR_TIP_MAX_ITEMS)) tip.appendChild(this.tipItem(/** @type {string} */ (el.dataset.passage)));
      if (els.length > TR_TIP_MAX_ITEMS) {
        const more = document.createElement('div');
        more.className = 'what'; more.textContent = `+ ${els.length - TR_TIP_MAX_ITEMS} more here`;
        tip.appendChild(more);
      }
    }
    tip.hidden = false;
    const wrap = this.els.wrap.getBoundingClientRect();
    const x0 = clientX - wrap.left, y0 = clientY - wrap.top;
    let x = x0 + 14, y = y0 + 18;
    if (x + tip.offsetWidth > wrap.width - 4) x = x0 - 14 - tip.offsetWidth;
    if (y + tip.offsetHeight > wrap.height - 4) y = y0 - 14 - tip.offsetHeight;
    tip.style.left = Math.max(4, x) + 'px';
    tip.style.top = Math.max(4, y) + 'px';
  }

  /** @param {string} msg @param {boolean} [bad] */
  toast(msg, bad = false) {
    const t = this.els.copied;
    t.textContent = msg;
    t.classList.toggle('bad', bad);
    t.hidden = false;
    clearTimeout(this.toastTimer);
    this.toastTimer = window.setTimeout(() => { t.hidden = true; }, 2200);
  }

  /** Copy the passage URN and the diplomatic text of the topmost region under the pointer.  @param {number} clientX @param {number} clientY */
  async copyAt(clientX, clientY) {
    const el = this.regionsAt(clientX, clientY)[0];
    if (!el) return;
    const passage = /** @type {string} */ (el.dataset.passage);
    const label = passageLabel(passage, this.titles);
    const text = passageText(this.textIndex, passage, 'diplomatic').parts.map(p => p.text).join(' ');
    if (!text) { this.toast(`No text of ${label} in this release`, true); return; }
    this.toast((await copyToClipboard(`${passage}\n${text}`)) ? `Copied the URN and text of ${label} to the clipboard` : `Could not copy ${label}`);
  }

  bind() {
    const root = this.viewer.root, v = this.viewer;
    /** @type {PointerEvent | null} */
    let pending = null;
    root.addEventListener('pointermove', e => {
      if (e.pointerType !== 'mouse' || v.dragging) return;
      pending = e;
      requestAnimationFrame(() => { if (pending) { this.showTipAt(pending.clientX, pending.clientY); pending = null; } });
    });
    root.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { pending = null; this.hideTip(); } });
    root.addEventListener('pointerdown', () => { if (v.pointers.size === 0) this.els.tip.hidden = true; });
    root.addEventListener('click', e => {
      if (v.dragging) return;
      if (e.target instanceof Element && e.target.closest('.roi-layer')) return;   // a region of interest of your own
      if (e.pointerType !== 'mouse') this.showTipAt(e.clientX, e.clientY);   // touch has no hover: a tap shows the text too
      this.copyAt(e.clientX, e.clientY);
    });
    root.addEventListener('wheel', () => this.hideTip(), { passive: true });
  }
}

</script>
<script>
// Browser UI for the images app: choose an image collection of the release,
// browse all its thumbnails at once (a light box with a Find box and a size slider), and open any image in a
// pannable, zoomable viewer.  Uses the shared sources inlined ahead of this
// file (see index.html).
//
// Address (no `#`): `?image=<collection URN>` is the light box of a collection,
// `?image=<image URN>` an image (`?image=<image URN>@x,y,w,h` also marks that region of it; Shift-drag marks others); `?page=<page URN>` or `?text=<passage URN>` are turned into an image through the
// DSE records and the catalog, and the address is rewritten as `?image=…`; so links, bookmarks and the Back button work.
(function () {
  const $ = id => document.getElementById(id);
  const proto = location.protocol;
  const THUMB_W = 240;

  /** @type {ImageCollection[]} */ let collections = [];
  /** @type {ImageCollection | null} */ let coll = null;
  /** @type {any} */ let locator = null;
  /** @type {ImageCollection | null} */ let gridOf = null;   // the collection whose thumbnails are in the grid
  let current = -1;           // index of the open image in `coll.items`, or -1
  let currentRoi = '';        // the region highlighted in the open image, as written in the address, or ""
  let tableScroll = 0;
  /** @type {any} */ let viewer = null;
  /** @type {any} */ let textRegions = null;   // indexed text on the open image
  /** @type {{byImage: Map<string, any>, textIndex: Map<string, any>, titles: Map<string, string>}} */
  let textData = { byImage: new Map(), textIndex: new Map(), titles: new Map() };
  /** @type {any} */ let roiUi = null;   // regions of interest drawn on the open image
  /** @type {Map<string, Promise<{width: number, height: number}>>} */ const sizes = new Map();
  let openToken = 0;
  let renderToken = 0;       // identifies the latest grid, so late thumbnail events can be ignored

  const plural = (n, one, many) => `${n.toLocaleString('en')} ${n === 1 ? one : many}`;
  const urlFor = (service, region, size) => matchProtocol(iiifImageUrl(service, region, size), proto);

  function setStatus(msg) { $('status').textContent = msg; }

  // --- loading ---------------------------------------------------------------

  function start(rel) {
    collections = imageCollections(rel);
    textData = { byImage: indexDse(rel).byImage, textIndex: buildTextIndex(rel), titles: catalogTitles(rel) };
    if (textRegions) textRegions.setData(textData);
    locator = createLocator(rel);
    coll = null; current = -1;
    const sel = $('collection');
    sel.textContent = '';
    const first = document.createElement('option');
    first.value = ''; first.textContent = 'Choose a collection…';
    sel.appendChild(first);
    for (const c of collections) {
      const o = document.createElement('option');
      o.value = c.urn;
      o.textContent = `${c.label} (${plural(c.items.length, 'image', 'images')})`;
      o.disabled = c.items.length === 0;
      sel.appendChild(o);
    }
    sel.disabled = collections.length === 0;
    const total = collections.reduce((n, c) => n + c.items.length, 0);
    setStatus(collections.length
      ? `${rel.library.name}: ${plural(collections.length, 'image collection', 'image collections')}, ${plural(total, 'image', 'images')}`
      : `${rel.library.name}: no image collections found`);
    $('drop').hidden = true;
    route();
  }

  function showProblem(msg) {
    setStatus('');
    $('problem').textContent = msg;
    $('drop').hidden = false;
  }

  async function loadFile(file) {
    setStatus(`Reading ${file.name}…`);
    try { start(await readReleaseFile(file)); }
    catch (e) { showProblem(`${file.name}: ${e.message || e}`); }
  }

  // --- navigation (address of the page) --------------------------------------------

  /** Go to a collection page or an image: update the address and show it at once. */
  function go(where, replace) {
    setQuery(imageParams(where), replace);
    route();
  }


  /** Passage (DSE key) the address asks for with `text`: its regions stay visible, and the layers start off. */
  let focusKey = '';
  function setFocus(text) {
    focusKey = text ? firstPassageKey(text) || '' : '';
    if (focusKey) for (const k of ['iliad', 'scholia', 'other']) $(`show-${k}`).checked = false;
  }

  function route() {
    const params = readParams(location.search);
    setFocus(params.text);
    const r = resolveImage(locator, params);
    if (r && 'error' in r) { selectCollection(null); showTable(r.error); return; }
    const roiText = r && 'roi' in r && r.roi ? r.roiText : '';   // an unusable region is dropped
    const canon = { image: r && !isCollectionUrn(r.image) ? r.image + (roiText ? '@' + roiText : '') : '', text: focusKey ? params.text : null };
    if (canon.image && decodeURIComponent(location.search) !== decodeURIComponent(formatQuery(canon))) setQuery(canon, true);   // the canonical address
    const h = r ? { urn: r.image } : null;
    if (!h) { selectCollection(null); showTable(); return; }
    const cu = collectionOfObject(h.urn);
    const c = collections.find(x => x.urn === cu);
    if (!c) { selectCollection(null); showTable(`${h.urn} is not an image collection or image in this release.`); return; }
    if (isCollectionUrn(h.urn)) { selectCollection(c); showTable(); return; }
    const idx = c.items.findIndex(i => i.urn === h.urn);
    if (idx < 0) { selectCollection(c); showTable(`${h.urn} is not in this release.`); return; }
    selectCollection(c);
    showViewer(idx, r && 'roi' in r ? r.roi : null, roiText);
  }

  function selectCollection(c) {
    if (c !== coll) { coll = c; gridOf = null; $('grid').textContent = ''; $('find').value = ''; }
    $('collection').value = c ? c.urn : '';
  }

  // --- light box ----------------------------------------------------------------

  /** @param {string} [message]  Shown instead of the grid when no collection is chosen, or as a note above it. */
  function showTable(message) {
    openToken++;
    if (viewer) viewer.close();
    if (roiUi) roiUi.close();
    if (textRegions) textRegions.clear();
    current = -1;
    $('viewer-view').hidden = true;
    $('table-view').hidden = false;
    renderGrid(message);
    $('table-view').scrollTop = tableScroll;
    document.title = coll ? `${coll.label} – Images` : 'Images';
  }

  /** Every thumbnail of the collection (the browser loads them as they scroll into view). */
  function renderGrid(message) {
    const grid = $('grid');
    $('note').hidden = !message || !coll;
    $('note').textContent = message || '';
    if (!coll) {
      grid.textContent = '';
      gridOf = null;
      $('intro').hidden = false;
      $('intro').textContent = message || (collections.length ? 'Choose a collection of images.' : '');
      $('shown').textContent = '';
      for (const id of ['find', 'cell-size']) $(id).disabled = true;
      return;
    }
    $('intro').hidden = true;
    for (const id of ['find', 'cell-size']) $(id).disabled = false;
    if (gridOf !== coll) {
      gridOf = coll;
      grid.textContent = '';
      const frag = document.createDocumentFragment();
      let loaded = 0, failed = 0;
      const mine = ++renderToken;
      const check = () => {
        if (mine !== renderToken || loaded > 0 || failed < 6) return;   // the first thumbnails all failed
        $('note').textContent = 'None of the thumbnails loaded. The image server may be unreachable, or this collection may not be served where this app expects it.';
        $('note').hidden = false;
      };
      coll.items.forEach((item, k) => {
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'cell'; b.dataset.index = String(k);
        b.title = item.caption || item.id;
        const thumb = document.createElement('span');
        thumb.className = 'thumb';
        const img = document.createElement('img');
        img.loading = 'lazy'; img.decoding = 'async'; img.alt = '';
        const service = imageService(item.urn);
        img.onload = () => {
          loaded++;
          if (img.naturalWidth && img.naturalHeight) thumb.style.aspectRatio = `${img.naturalWidth} / ${img.naturalHeight}`;
        };
        img.onerror = () => { failed++; thumb.classList.add('missing'); check(); };
        if (service) img.src = urlFor(service, 'full', `${THUMB_W},`); else { thumb.classList.add('missing'); failed++; check(); }
        thumb.appendChild(img);
        const lbl = document.createElement('span');
        lbl.className = 'lbl'; lbl.textContent = item.label;
        b.append(thumb, lbl);
        frag.appendChild(b);
      });
      grid.appendChild(frag);
    }
    applyFilter();
  }

  /** Show the thumbnails whose captions match the Find box. */
  function applyFilter() {
    if (!coll) return;
    const q = $('find').value;
    const cells = $('grid').children;
    let shown = 0;
    coll.items.forEach((item, k) => {
      const ok = imageMatches(item, q);
      cells[k].hidden = !ok;
      if (ok) shown++;
    });
    $('shown').textContent = shown === coll.items.length
      ? plural(coll.items.length, 'image', 'images')
      : `${shown.toLocaleString('en')} of ${plural(coll.items.length, 'image', 'images')} shown`;
    $('empty').hidden = shown > 0;
  }

  // --- viewer --------------------------------------------------------------------

  /** Pixel size of an image, from its IIIF info.json (asked once per image). */
  function imageSize(service) {
    let p = sizes.get(service);
    if (!p) {
      p = fetch(matchProtocol(`${service}/info.json`, proto))
        .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
        .then(j => parseInfo(j) || Promise.reject(new Error('no width and height in the image information')));
      p.catch(() => sizes.delete(service));
      sizes.set(service, p);
    }
    return p;
  }

  /**
   * Open an image, highlighting a region of it if one is given.
   * @param {number} idx  Index in `coll.items`.
   * @param {{x: number, y: number, w: number, h: number} | null} [roi]  Fractions of the image size.
   * @param {string} [roiText]  The region as written in the address.
   */
  async function showViewer(idx, roi = null, roiText = '') {
    if (idx === current && roiText === currentRoi && !$('viewer-view').hidden) return;
    currentRoi = roiText;
    if (current < 0) tableScroll = $('table-view').scrollTop;
    current = idx;
    const item = coll.items[idx];
    const token = ++openToken;
    $('table-view').hidden = true;
    $('viewer-view').hidden = false;
    if (!viewer) {
      viewer = new IiifViewer($('viewer'));
      textRegions = new TextRegions(viewer, {
        tip: $('tip'), copied: $('copied'), wrap: $('viewer-wrap'),
        checks: { iliad: $('show-iliad'), scholia: $('show-scholia'), other: $('show-other') },
        onShown: n => { $('layers').hidden = n === 0; },
      });
      textRegions.setData(textData);
      roiUi = new RoiUi(viewer, { button: $('roi-select'), panel: $('roi-panel') });
    }
    viewer.close();
    roiUi.close();
    textRegions.clear();
    $('viewer-title').textContent = item.label;
    $('viewer-count').textContent = `${idx + 1} of ${coll.items.length}`;
    $('viewer-note').textContent = (item.caption || item.id) + (roi ? ` · highlighted region @${roiText}` : '');
    $('rights').textContent = item.rights || 'No rights statement in the release.';
    $('viewer-error').hidden = true;
    $('prev').disabled = idx === 0;
    $('next').disabled = idx === coll.items.length - 1;
    document.title = `${item.label} – ${coll.label} – Images`;

    const service = imageService(item.urn);
    try {
      if (!service) throw new Error(`cannot work out where ${item.urn} is served`);
      const { width, height } = await imageSize(service);
      if (token !== openToken) return;
      viewer.open({
        width, height,
        urlFor: (region, size) => urlFor(service, region, size),
        placeholders: [urlFor(service, 'full', `${THUMB_W},`)],
      });
      const nText = textRegions.show(item.urn, width, height, focusKey);
      if (nText) $('viewer-note').textContent += ` · ${plural(nText, 'indexed passage', 'indexed passages')}`;
      roiUi.open(item.urn, roi ? [roi] : []);
      if (roi) zoomToRegion(roi, width, height);
      viewer.root.focus({ preventScroll: true });
    } catch (e) {
      if (token !== openToken) return;
      $('viewer-error').textContent = `Could not load this image (${e.message || e}).`;
      $('viewer-error').hidden = false;
    }
  }

  /** Bring a region of the open image into view: zoomed to it, but never past full resolution. */
  function zoomToRegion(roi, width, height) {
    const r = roiToRect(roi, width, height);
    const { w: vw, h: vh } = viewer.size;
    if (!vw || !vh) return;
    const sc = Math.max(viewer.minScale, Math.min(0.5 * vw / r.w, 0.5 * vh / r.h, 1));
    viewer.set({ sc, tx: vw / 2 - (r.x + r.w / 2) * sc, ty: vh / 2 - (r.y + r.h / 2) * sc });
  }

  function step(delta) {
    if (current < 0) return;
    const n = current + delta;
    if (n >= 0 && n < coll.items.length) go({ urn: coll.items[n].urn }, true);
  }

  function backToGrid() {
    go({ urn: coll.urn }, false);
  }

  // --- wiring ---------------------------------------------------------------------

  $('collection').addEventListener('change', e => {
    tableScroll = 0;
    const urn = e.target.value;
    if (urn) go({ urn }, false); else { setQuery({}, false); route(); }
  });
  $('find').addEventListener('input', applyFilter);
  $('cell-size').addEventListener('input', e => { $('grid').style.setProperty('--cell-w', e.target.value + 'px'); });
  $('grid').addEventListener('click', e => {
    const cell = e.target.closest('.cell');
    if (cell) go({ urn: coll.items[Number(cell.dataset.index)].urn }, false);
  });

  $('back').addEventListener('click', backToGrid);
  $('prev').addEventListener('click', () => step(-1));
  $('next').addEventListener('click', () => step(1));
  $('zoom-in').addEventListener('click', () => viewer && viewer.zoomBy(1.5));
  $('zoom-out').addEventListener('click', () => viewer && viewer.zoomBy(1 / 1.5));
  $('fit').addEventListener('click', () => viewer && viewer.fit());
  $('rights-toggle').addEventListener('click', () => {
    const open = $('rights').hidden;
    $('rights').hidden = !open;
    $('rights-toggle').setAttribute('aria-expanded', String(open));
  });

  window.addEventListener('popstate', () => { if (collections.length) route(); });   // Back, Forward
  document.addEventListener('keydown', e => {
    if ($('viewer-view').hidden || e.target.closest('input, select') || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Escape') backToGrid();
    else if (e.key === '[' || e.key === 'PageUp') { e.preventDefault(); step(-1); }
    else if (e.key === ']' || e.key === 'PageDown') { e.preventDefault(); step(1); }
  });

  $('file').addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });
  window.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('dragging'); });
  window.addEventListener('dragleave', () => document.body.classList.remove('dragging'));
  window.addEventListener('drop', e => {
    e.preventDefault(); document.body.classList.remove('dragging');
    if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
  });

  (async function init() {
    try { start(await fetchRelease()); }
    catch (e) { showProblem(`Could not load the HMT release (${e.message || e}). If you are offline, load a copy of the release from your computer.`); }
  })();
})();

</script>
</body>
</html>
