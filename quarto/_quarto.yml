project:
  type: website
  output-dir: quarto_build

version: "0.12.0"
metadata:
  date: today
  
execute:
  freeze: auto
date: last-modified  

format:
  html:
    theme:
      - cosmo
      - brand
    toc: true

website:
  title: "hmt-apps"
  page-footer:
    center: "`hmt-apps` release **{{< meta version >}}**, website last updated {{< meta date >}}"

  navbar:
    background: primary
    search: true
    left:
      - text: "About" 
        file: about.qmd
      - text: "Starting points"
        file: archive/index.qmd
      - text: "The apps"
        file: apps/index.qmd
      - text: "Docs"
        file: docs/index.qmd
    right:
      - icon: person-circle
        menu:
          - text: "hmt-apps on github"
            href: https://github.com/neelsmith/hmt-apps
          - text: "Neel Smith"
            href: https://neelsmith.github.io/
        aria-label: Home 
  sidebar:
